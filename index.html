// Pop-ups: popover (small menu at an element), modal (dialog), toast (short message), tooltip (chart readout).



function layer(id) {
  let el = document.getElementById(id);
  if (!el) {
    el = h('div', { id });
    document.body.appendChild(el);
  }
  return el;
}

// ---------- Popover ----------
let popEl = null;
let popAnchor = null;

function closePopover() {
  if (popEl && popEl.parentNode) popEl.parentNode.removeChild(popEl);
  popEl = null;
  if (popAnchor && document.body.contains(popAnchor)) popAnchor.setAttribute('aria-expanded', 'false');
  popAnchor = null;
}

function popoverOpen() {
  return !!popEl;
}

/** Open a popover under `anchor`. `content` is a DOM node. */
function openPopover(anchor, content, opts) {
  const same = popAnchor === anchor;
  closePopover();
  if (same) return;
  const o = opts || {};
  popEl = h('div', { class: 'pop' + (o.cls ? ' ' + o.cls : ''), role: 'dialog' }, content);
  popAnchor = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  layer('zt-pop').appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  const pw = popEl.offsetWidth;
  const ph = popEl.offsetHeight;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  let left = o.align === 'right' ? r.right - pw : r.left;
  left = Math.max(8, Math.min(left, vw - pw - 8));
  let top = r.bottom + 4;
  if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 4);
  popEl.style.left = left + 'px';
  popEl.style.top = top + 'px';
  const first = popEl.querySelector('[data-autofocus]') || popEl.querySelector('button, input, select, textarea');
  if (first && !o.noFocus) first.focus();
}

/** A menu list for a popover. items: [{ label, onpick, selected, swatch, iconName, danger, node }] */
function menuList(items) {
  return h(
    'div',
    { class: 'menu', role: 'menu' },
    items.map((it) =>
      it.sep
        ? h('div', { class: 'menu-sep' })
        : h(
            'button',
            {
              class: 'menu-item' + (it.selected ? ' is-selected' : '') + (it.danger ? ' is-danger' : ''),
              role: 'menuitem',
              type: 'button',
              onclick: () => {
                closePopover();
                it.onpick();
              },
            },
            it.node || null,
            it.swatch ? h('span', { class: 'menu-swatch', style: { background: it.swatch } }) : null,
            it.iconName ? icon(it.iconName, 15) : null,
            h('span', { class: 'menu-label' }, it.label),
            it.hint ? h('span', { class: 'menu-hint' }, it.hint) : null,
            it.selected ? icon('check', 14, 'menu-check') : null
          )
    )
  );
}

// ---------- Modal ----------
let modalStack = [];

function closeModal() {
  const m = modalStack.pop();
  if (!m) return;
  if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
  if (m.onclose) m.onclose();
  if (m.restore && document.body.contains(m.restore)) m.restore.focus();
}

function modalOpen() {
  return modalStack.length > 0;
}

/**
 * Open a dialog.
 * opts: { title, body (node or array), actions: [{ label, kind: 'primary' | 'danger' | '', onclick, keepOpen }], onclose, wide }
 */
function openModal(opts) {
  const restore = document.activeElement;
  const titleId = 'zt-modal-title-' + (modalStack.length + 1);
  const box = h(
    'div',
    { class: 'modal' + (opts.wide ? ' modal-wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
    h('div', { class: 'modal-head' }, h('h2', { id: titleId, class: 'modal-title' }, opts.title), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: () => closeModal() }, icon('x', 16))),
    h('div', { class: 'modal-body' }, opts.body),
    opts.actions && opts.actions.length
      ? h(
          'div',
          { class: 'modal-foot' },
          opts.actions.map((a) =>
            h(
              'button',
              {
                class: 'btn' + (a.kind === 'primary' ? ' btn-primary' : a.kind === 'danger' ? ' btn-danger' : ''),
                type: 'button',
                onclick: () => {
                  const res = a.onclick ? a.onclick() : undefined;
                  if (res !== false && !a.keepOpen) closeModal();
                },
              },
              a.label
            )
          )
        )
      : null
  );
  const wrap = h(
    'div',
    {
      class: 'modal-wrap',
      onmousedown: (e) => {
        if (e.target === wrap) closeModal();
      },
    },
    box
  );
  box.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const items = [...box.querySelectorAll('button, input, select, textarea, [tabindex]')].filter((el) => !el.disabled && el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
  layer('zt-modal').appendChild(wrap);
  modalStack.push({ el: wrap, onclose: opts.onclose, restore });
  const first = box.querySelector('[data-autofocus]') || box.querySelector('.modal-body input, .modal-body textarea, .modal-body select, .modal-body button') || box.querySelector('button');
  if (first) first.focus();
  return box;
}

/** A yes/no question. */
function confirmModal(title, message, yesLabel, onYes, danger) {
  openModal({
    title,
    body: h('p', { class: 'modal-text' }, message),
    actions: [
      { label: 'Cancel' },
      { label: yesLabel, kind: danger ? 'danger' : 'primary', onclick: onYes },
    ],
  });
}

// ---------- Toast ----------
let toastTimer = 0;

function toast(message, action) {
  const root = layer('zt-toast');
  clear(root);
  clearTimeout(toastTimer);
  const el = h(
    'div',
    { class: 'toast', role: 'status' },
    h('span', null, message),
    action
      ? h(
          'button',
          {
            class: 'toast-btn',
            type: 'button',
            onclick: () => {
              clear(root);
              action.onclick();
            },
          },
          action.label
        )
      : null
  );
  root.appendChild(el);
  toastTimer = setTimeout(() => clear(root), action ? 7000 : 3500);
}

// ---------- Chart tooltip ----------
let tipEl = null;

function showTip(content, x, y) {
  if (!tipEl) {
    tipEl = h('div', { class: 'tip', role: 'tooltip' });
    layer('zt-tip').appendChild(tipEl);
  }
  clear(tipEl);
  tipEl.appendChild(content);
  tipEl.style.display = 'block';
  const w = tipEl.offsetWidth;
  const ht = tipEl.offsetHeight;
  const vw = document.documentElement.clientWidth;
  let left = x + 14;
  if (left + w > vw - 8) left = x - w - 14;
  let top = y - ht - 10;
  if (top < 8) top = y + 16;
  tipEl.style.left = Math.max(8, left) + 'px';
  tipEl.style.top = top + 'px';
}

function hideTip() {
  if (tipEl) tipEl.style.display = 'none';
}

// ---------- Global keys and clicks ----------
function installOverlayHandlers() {
  document.addEventListener('mousedown', (e) => {
    if (popEl && !popEl.contains(e.target) && !(popAnchor && popAnchor.contains(e.target))) closePopover();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (popEl) {
      const a = popAnchor;
      closePopover();
      if (a && document.body.contains(a)) a.focus();
      e.stopImmediatePropagation();
    } else if (modalStack.length) {
      closeModal();
      e.stopImmediatePropagation();
    }
  });
  window.addEventListener('resize', closePopover);
}

const GROUP_COLORS = ['#5AA2F0', '#C58AF9', '#3DD6A8', '#F2A93B', '#F08BB4', '#8FB8C9', '#B7C36B', '#E8845C'];

  return PERSON_COLORS[(p && p.color ? p.color : 0) % PERSON_COLORS.length];
}
function groupColor(g) {

function avatar(person, size) {
  const sz = size || 22;

// ---------- "What went wrong?" ----------

function askLapse(taskId, kind) {
  const task = getTask(app.state, taskId);
  if (!task) return;
  let reason = '';
  let follow = '';
  const t = today();
  const late = kind === 'late';
  const days = late && task.due ? diffDays(task.due, t) : 0;
  const note = h('textarea', { class: 'input', rows: 2, placeholder: late ? 'Example: client approval came 2 days late' : 'Example: waiting for product photos', 'aria-label': 'Note' });
  const chips = h('div', { class: 'chips', role: 'radiogroup', 'aria-label': 'Reason' });
  const err = h('p', { class: 'field-err', hidden: true }, 'Select a reason.');
  const drawChips = () => {
    while (chips.firstChild) chips.removeChild(chips.firstChild);
    LAPSE_REASONS.forEach((r) => {
      chips.appendChild(
        h(
          'button',
          {
            class: 'chip-opt' + (reason === r.id ? ' is-on' : ''),
            type: 'button',
            role: 'radio',
            'aria-checked': reason === r.id ? 'true' : 'false',
            onclick: () => {
              reason = r.id;
              err.hidden = true;
              drawChips();
            },
          },
          r.label
        )
      );
    });
  };
  drawChips();

  const followRow = h('div', { class: 'chips' });
  const drawFollow = () => {
    while (followRow.firstChild) followRow.removeChild(followRow.firstChild);
    [
      ['', 'No follow-up'],
      [addDays(t, 1), 'Tomorrow'],
      [addDays(t, 3), 'In 3 days'],
      [addDays(t, 7), 'In 1 week'],
    ].forEach((o) => {
      followRow.appendChild(
        h(
          'button',
          {
            class: 'chip-opt' + (follow === o[0] ? ' is-on' : ''),
            type: 'button',
            onclick: () => {
              follow = o[0];
              drawFollow();
            },
          },
          o[1]
        )
      );
    });
  };
  drawFollow();

  openModal({
    title: late ? 'What made this task late?' : 'What blocks this task?',
    body: [
      h('p', { class: 'modal-text' }, h('strong', null, task.title), late ? ' was completed ' + days + (days === 1 ? ' day' : ' days') + ' after the due date.' : ' is now Stuck.'),
      h('p', { class: 'modal-hint' }, 'Your answer goes to the Review screen. It shows the causes that repeat.'),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Reason'), chips, err),
      h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Note (optional)'), note),
      late ? null : h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Remind me to follow up'), followRow),
    ],
    actions: [
      { label: 'Skip' },
      {
        label: 'Save reason',
        kind: 'primary',
        onclick: () => {
          if (!reason) {
            err.hidden = false;
            return false;
          }
          let st = addLapse(app.state, taskId, kind, reason, note.value.trim(), t);
          if (!late && follow) st = updateTask(st, taskId, { followUp: follow });
          commit(st);
          toast('Reason saved.');
          return true;
        },
      },
    ],
  });
}

/** Text for a due date cell: { text, tone } where tone is '', 'late', 'today' or 'done'. */
function dueInfo(task, t) {
  if (!task.due) return { text: '', tone: '' };
  const y = parts(t).y;
  const text = fmtShort(task.due, y);
  if (task.status === 'done') return { text, tone: 'done' };
  if (isOverdue(task, t)) return { text, tone: 'late', extra: diffDays(task.due, t) + 'd late' };
  if (task.due === t) return { text, tone: 'today', extra: 'Today' };
  return { text, tone: '' };
}

// ---------- Recurrence fields ----------

function recurFields(current, onchange) {
  const freq = h(
    'select',
    { class: 'input', 'aria-label': 'Repeats' },
    h('option', { value: '', selected: !current }, 'Does not repeat'),
    RECUR_FREQ.map((f) => h('option', { value: f.id, selected: current && current.freq === f.id }, f.label))
  );
  const every = h('input', { class: 'input input-num', type: 'number', min: 1, max: 99, value: current ? current.interval || 1 : 1, 'aria-label': 'Repeat interval' });
  const unit = h('span', { class: 'recur-unit' });
  const wrap = h('div', { class: 'recur-every' }, 'every', every, unit);
  const sync = () => {
    const f = RECUR_FREQ.find((x) => x.id === freq.value);
    wrap.hidden = !f;
    if (f) unit.textContent = f.unit + (Number(every.value) > 1 ? 's' : '');
  };
  const fire = () => {
    sync();
    const n = Math.max(1, Math.min(99, Math.round(Number(every.value)) || 1));
    onchange(freq.value ? { freq: freq.value, interval: n } : null);
  };
  freq.addEventListener('change', fire);
  every.addEventListener('change', fire);
  sync();
  return h('div', { class: 'recur-fields' }, freq, wrap);
}

// ---- src/charts.js ----
// Charts, drawn as SVG by hand. No chart library.
// Rules: thin marks, hairline grid, one y-axis, a legend for 2 or more series, a hover readout on every chart.





// One observer redraws every chart when its box changes size.
let chartObserver = null;
const chartDraw = new WeakMap();

function resetCharts() {
  if (chartObserver) chartObserver.disconnect();
  hideTip();
}

/** A box that calls draw(el, width) when it gets a size and when the size changes. */
function chartBox(height, draw, label) {
  const el = h('div', { class: 'chart', style: { height: height + 'px' }, role: 'img', 'aria-label': label || 'Chart' });
  chartDraw.set(el, { draw, width: 0 });
  if (typeof ResizeObserver === 'undefined') {
    setTimeout(() => draw(el, el.clientWidth || 600), 0);
    return el;
  }
  if (!chartObserver) {
    chartObserver = new ResizeObserver((entries) => {
      entries.forEach((en) => {
        const rec = chartDraw.get(en.target);
        const w = Math.floor(en.contentRect.width);
        if (!rec || w < 40 || w === rec.width) return;
        rec.width = w;
        rec.draw(en.target, w);
      });
    });
  }
  chartObserver.observe(el);
  return el;
}

/** Round axis maximum and step for a count axis. */
function niceScale(max) {
  if (max <= 4) return { max: 4, step: 1 };
  const rough = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const n = rough / pow;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
  return { max: Math.ceil(max / step) * step, step };
}

function tipRows(title, rows) {
  return h(
    'div',
    null,
    h('div', { class: 'tip-title' }, title),
    rows.map((r) => h('div', { class: 'tip-row' }, r.color ? h('span', { class: r.box ? 'tip-box' : 'tip-key', style: { background: r.color } }) : null, h('span', { class: 'tip-val' }, r.value), h('span', { class: 'tip-name' }, r.name)))
  );
}

function legend(items) {
  return h(
    'div',
    { class: 'legend' },
    items.map((it) => h('span', { class: 'legend-item' }, h('span', { class: it.line ? 'legend-line' : 'legend-box', style: { background: it.color } }), it.label, it.value !== undefined ? h('span', { class: 'legend-val num' }, it.value) : null))
  );
}

/**
 * Line chart.
 * opts: { points: [{ label, full }], series: [{ name, color, values: [], area }], height }
 */
function lineChart(opts) {
  const height = opts.height || 220;
  const draw = (el, width) => {
    clear(el);
    const m = { l: 30, r: 14, t: 10, b: 24 };
    const iw = width - m.l - m.r;
    const ih = height - m.t - m.b;
    const n = opts.points.length;
    let max = 0;
    opts.series.forEach((se) => se.values.forEach((v) => (max = Math.max(max, v))));
    const fmt = opts.fmt || ((v) => String(v));
    if (opts.fmt) m.l = 52;
    const sc = niceScale(max);
    const iw2 = width - m.l - m.r;
    const x = (i) => m.l + (n <= 1 ? iw2 / 2 : (i / (n - 1)) * iw2);
    const y = (v) => m.t + ih - (v / sc.max) * ih;
    const svg = s('svg', { width, height, viewBox: '0 0 ' + width + ' ' + height, class: 'chart-svg' });

    for (let v = 0; v <= sc.max; v += sc.step) {
      svg.appendChild(s('line', { x1: m.l, x2: width - m.r, y1: y(v), y2: y(v), class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: y(v) + 3.5, class: 'tick', 'text-anchor': 'end' }, fmt(v)));
    }
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 64))));
    for (let i = n - 1; i >= 0; i -= every) {
      svg.appendChild(s('text', { x: x(i), y: height - 6, class: 'tick', 'text-anchor': i === n - 1 ? 'end' : 'middle' }, opts.points[i].label));
    }

    opts.series.forEach((se) => {
      const pts = se.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
      if (se.area && n > 1) svg.appendChild(s('path', { d: 'M' + x(0).toFixed(1) + ',' + y(0) + ' L' + pts.join(' L') + ' L' + x(n - 1).toFixed(1) + ',' + y(0) + ' Z', fill: se.color, opacity: 0.1 }));
      svg.appendChild(s('path', { d: 'M' + pts.join(' L'), fill: 'none', stroke: se.color, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1, class: 'chart-line' }));
      if (n) svg.appendChild(s('circle', { cx: x(n - 1), cy: y(se.values[n - 1]), r: 4, fill: se.color, class: 'dot-ring' }));
    });

    const cross = s('line', { y1: m.t, y2: m.t + ih, class: 'crosshair', visibility: 'hidden' });
    svg.appendChild(cross);
    const dots = opts.series.map((se) => {
      const c = s('circle', { r: 4, fill: se.color, class: 'dot-ring', visibility: 'hidden' });
      svg.appendChild(c);
      return c;
    });
    const hit = s('rect', { x: m.l, y: m.t, width: Math.max(0, iw2), height: ih, fill: 'transparent', tabindex: 0, class: 'chart-hit', 'aria-label': 'Chart values. Use the left and right arrow keys.' });
    let idx = n - 1;
    const show = (i, px, py) => {
      idx = Math.max(0, Math.min(n - 1, i));
      cross.setAttribute('x1', x(idx));
      cross.setAttribute('x2', x(idx));
      cross.setAttribute('visibility', 'visible');
      opts.series.forEach((se, k) => {
        dots[k].setAttribute('cx', x(idx));
        dots[k].setAttribute('cy', y(se.values[idx]));
        dots[k].setAttribute('visibility', 'visible');
      });
      const box = svg.getBoundingClientRect();
      showTip(tipRows(opts.points[idx].full || opts.points[idx].label, opts.series.map((se) => ({ color: se.color, value: fmt(se.values[idx]), name: se.name }))), px === undefined ? box.left + x(idx) : px, py === undefined ? box.top + m.t + 20 : py);
    };
    const hide = () => {
      cross.setAttribute('visibility', 'hidden');
      dots.forEach((d) => d.setAttribute('visibility', 'hidden'));
      hideTip();
    };
    hit.addEventListener('pointermove', (e) => {
      const box = svg.getBoundingClientRect();
      const rel = e.clientX - box.left - m.l;
      show(Math.round((rel / Math.max(1, iw2)) * (n - 1)), e.clientX, e.clientY);
    });
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => show(idx));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
      else return;
      e.preventDefault();
    });
    svg.appendChild(hit);
    el.appendChild(svg);
  };
  return chartBox(height, draw, opts.label);
}

/**
 * Donut chart with the total in the centre.
 * opts: { parts: [{ name, value, color, onclick }], centerLabel, size }
 */
function donutChart(opts) {
  const size = opts.size || 180;
  const total = opts.parts.reduce((a, p) => a + p.value, 0);
  const svg = s('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size, class: 'chart-svg donut', role: 'img', 'aria-label': opts.label || 'Donut chart' });
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 6;
  const thick = Math.round(size * 0.14);
  const rm = r - thick / 2;
  const circ = 2 * Math.PI * rm;
  svg.appendChild(s('circle', { cx, cy, r: rm, fill: 'none', class: 'donut-track', 'stroke-width': thick }));
  if (total > 0) {
    const live = opts.parts.filter((p) => p.value > 0);
    const gap = live.length > 1 ? 2.5 : 0;
    let offset = 0;
    live.forEach((p) => {
      const len = (p.value / total) * circ;
      const seg = s('circle', {
        cx,
        cy,
        r: rm,
        fill: 'none',
        stroke: p.color,
        'stroke-width': thick,
        'stroke-dasharray': Math.max(0.5, len - gap).toFixed(2) + ' ' + (circ - Math.max(0.5, len - gap)).toFixed(2),
        'stroke-dashoffset': (-offset - gap / 2).toFixed(2),
        transform: 'rotate(-90 ' + cx + ' ' + cy + ')',
        class: 'donut-seg' + (p.onclick ? ' is-click' : ''),
        tabindex: 0,
        role: p.onclick ? 'button' : 'img',
        'aria-label': p.name + ': ' + p.value + ' (' + Math.round((p.value / total) * 100) + '%)',
      });
      const tip = (e) => {
        const box = svg.getBoundingClientRect();
        showTip(tipRows(p.name, [{ color: p.color, box: true, value: p.value, name: Math.round((p.value / total) * 100) + '% of ' + total }]), e && e.clientX ? e.clientX : box.left + cx, e && e.clientY ? e.clientY : box.top + 20);
      };
      seg.addEventListener('pointermove', tip);
      seg.addEventListener('pointerleave', hideTip);
      seg.addEventListener('focus', () => tip());
      seg.addEventListener('blur', hideTip);
      if (p.onclick) {
        seg.addEventListener('click', p.onclick);
        seg.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            p.onclick();
          }
        });
      }
      svg.appendChild(seg);
      offset += len;
    });
  }
  svg.appendChild(s('text', { x: cx, y: cy + 2, class: 'donut-total', 'text-anchor': 'middle' }, total));
  svg.appendChild(s('text', { x: cx, y: cy + 20, class: 'donut-label', 'text-anchor': 'middle' }, opts.centerLabel || 'total'));
  return svg;
}

/**
 * Stacked column chart.
 * opts: { cols: [{ label, full, parts: [{ name, value, color }] , note }], height }
 */
function columnChart(opts) {
  const height = opts.height || 200;
  const draw = (el, width) => {
    clear(el);
    const m = { l: 30, r: 10, t: 10, b: 24 };
    const iw = width - m.l - m.r;
    const ih = height - m.t - m.b;
    const n = opts.cols.length;
    let max = 0;
    opts.cols.forEach((c) => (max = Math.max(max, c.parts.reduce((a, p) => a + p.value, 0))));
    const sc = niceScale(max);
    const band = iw / Math.max(1, n);
    const bw = Math.min(24, Math.max(6, band * 0.5));
    const y = (v) => m.t + ih - (v / sc.max) * ih;
    const svg = s('svg', { width, height, viewBox: '0 0 ' + width + ' ' + height, class: 'chart-svg' });
    for (let v = 0; v <= sc.max; v += sc.step) {
      svg.appendChild(s('line', { x1: m.l, x2: width - m.r, y1: y(v), y2: y(v), class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: y(v) + 3.5, class: 'tick', 'text-anchor': 'end' }, v));
    }
    opts.cols.forEach((c, i) => {
      const cx = m.l + band * i + band / 2;
      const g = s('g', { class: 'col', tabindex: 0, role: 'img', 'aria-label': (c.full || c.label) + ': ' + c.parts.map((p) => p.value + ' ' + p.name).join(', ') });
      let acc = 0;
      const live = c.parts.filter((p) => p.value > 0);
      live.forEach((p, k) => {
        const y0 = y(acc);
        const y1 = y(acc + p.value);
        acc += p.value;
        const top = k === live.length - 1;
        const gapPx = k > 0 ? 2 : 0;
        const hgt = Math.max(1, y0 - y1 - gapPx);
        const rr = top ? Math.min(4, hgt) : 0;
        const x0 = cx - bw / 2;
        // Rounded at the data end only, square at the baseline.
        g.appendChild(s('path', { d: 'M' + x0 + ',' + (y1 + hgt) + ' V' + (y1 + rr) + ' Q' + x0 + ',' + y1 + ' ' + (x0 + rr) + ',' + y1 + ' H' + (x0 + bw - rr) + ' Q' + (x0 + bw) + ',' + y1 + ' ' + (x0 + bw) + ',' + (y1 + rr) + ' V' + (y1 + hgt) + ' Z', fill: p.color }));
      });
      g.appendChild(s('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent' }));
      const tip = (e) => {
        const box = svg.getBoundingClientRect();
        const rows = c.parts.map((p) => ({ color: p.color, box: true, value: p.value, name: p.name }));
        if (c.note) rows.push({ value: c.note, name: '' });
        showTip(tipRows(c.full || c.label, rows), e && e.clientX ? e.clientX : box.left + cx, e && e.clientY ? e.clientY : box.top + m.t + 20);
      };
      g.addEventListener('pointermove', tip);
      g.addEventListener('pointerleave', hideTip);
      g.addEventListener('focus', () => tip());
      g.addEventListener('blur', hideTip);
      svg.appendChild(g);
      svg.appendChild(s('text', { x: cx, y: height - 6, class: 'tick', 'text-anchor': 'middle' }, c.label));
    });
    el.appendChild(svg);
  };
  return chartBox(height, draw, opts.label);
}

/**
 * Columns side by side for each period (for example revenue and expenses for each month).
 * opts: { cols: [{ label, full, values: [{ name, value, color }] }], height, fmt, label }
 */
function groupedColumns(opts) {
  const height = opts.height || 280;
  const fmt = opts.fmt || ((v) => String(v));
  const draw = (el, width) => {
    clear(el);
    const m = { l: 46, r: 8, t: 10, b: 26 };
    const iw = width - m.l - m.r;
    const ih = height - m.t - m.b;
    const n = opts.cols.length;
    let max = 0;
    opts.cols.forEach((c) => c.values.forEach((v) => (max = Math.max(max, v.value))));
    const sc = niceScale(max);
    const band = iw / Math.max(1, n);
    const k = opts.cols[0] ? opts.cols[0].values.length : 1;
    const bw = Math.min(22, Math.max(5, (band * 0.56) / k));
    const gap = 3;
    const y = (v) => m.t + ih - (Math.max(0, v) / sc.max) * ih;
    const svg = s('svg', { width, height, viewBox: '0 0 ' + width + ' ' + height, class: 'chart-svg' });
    for (let v = 0; v <= sc.max + 0.0001; v += sc.step) {
      svg.appendChild(s('line', { x1: m.l, x2: width - m.r, y1: y(v), y2: y(v), class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: y(v) + 3.5, class: 'tick', 'text-anchor': 'end' }, fmt(v)));
    }
    opts.cols.forEach((c, i) => {
      const cx = m.l + band * i + band / 2;
      const total = k * bw + (k - 1) * gap;
      const g = s('g', { class: 'col', tabindex: 0, role: 'img', 'aria-label': (c.full || c.label) + ': ' + c.values.map((v) => v.name + ' ' + fmt(v.value)).join(', ') });
      c.values.forEach((v, j) => {
        const x0 = cx - total / 2 + j * (bw + gap);
        const y1 = y(v.value);
        const hgt = Math.max(v.value > 0 ? 1.5 : 0, m.t + ih - y1);
        const rr = Math.min(3, hgt);
        if (hgt > 0) g.appendChild(s('path', { d: 'M' + x0 + ',' + (y1 + hgt) + ' V' + (y1 + rr) + ' Q' + x0 + ',' + y1 + ' ' + (x0 + rr) + ',' + y1 + ' H' + (x0 + bw - rr) + ' Q' + (x0 + bw) + ',' + y1 + ' ' + (x0 + bw) + ',' + (y1 + rr) + ' V' + (y1 + hgt) + ' Z', fill: v.color }));
      });
      g.appendChild(s('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent' }));
      const tip = (e) => {
        const box = svg.getBoundingClientRect();
        const rows = c.values.map((v) => ({ color: v.color, box: true, value: fmt(v.value), name: v.name }));
        if (c.note) rows.push({ value: c.note, name: '' });
        showTip(tipRows(c.full || c.label, rows), e && e.clientX ? e.clientX : box.left + cx, e && e.clientY ? e.clientY : box.top + m.t + 20);
      };
      g.addEventListener('pointermove', tip);
      g.addEventListener('pointerleave', hideTip);
      g.addEventListener('focus', () => tip());
      g.addEventListener('blur', hideTip);
      svg.appendChild(g);
      svg.appendChild(s('text', { x: cx, y: height - 7, class: 'tick', 'text-anchor': 'middle' }, c.label));
    });
    el.appendChild(svg);
  };
  return chartBox(height, draw, opts.label);
}

/**

 * rows: [{ label, value, parts: [{ name, value, color }], note, onclick }]
 */
function barList(rows, opts) {
  const o = opts || {};

// ---- src/view_tasks.js ----
// Tasks screen: the Monday-style table. Groups, colour status cells, owner, due date, priority, follow-up, remarks, subtasks.








const RECENT_DAYS = 14;

function taskMatches(t, f, td) {
  if (f.ownerId && !isAssigned(t, f.ownerId)) return false;
  if (f.clientId && t.clientId !== f.clientId) return false;
  if (f.status && t.status !== f.status) return false;
  if (f.special === 'overdue' && !isOverdue(t, td)) return false;
  if (f.special === 'today' && !(isOpen(t) && t.due === td)) return false;
  if (f.special === 'week' && !(isOpen(t) && t.due && t.due >= td && t.due <= addDays(td, 6))) return false;
  if (f.special === 'followup' && !followUpDue(t, td)) return false;
  if (f.special === 'open' && !isOpen(t)) return false;
  if (t.status === 'done' && !f.status && !f.special) {
    if (f.done === 'hide') return false;
    if (f.done === 'recent' && t.completedOn && t.completedOn < addDays(td, -RECENT_DAYS)) return false;
  }
  if (f.search) {
    const q = f.search.toLowerCase();
    const hay = (t.title + ' ' + t.remarks + ' ' + (t.itemId || '') + ' ' + (t.subtasks || []).map((s) => s.title).join(' ')).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}

const PRIO_RANK = { high: 0, medium: 1, low: 2 };
const STATUS_RANK = { stuck: 0, in_progress: 1, not_started: 2, done: 3 };

function sortTasks(list, sort) {
  const out = list.slice();
  const due = (t) => t.due || '9999-12-31';
  if (sort === 'due') out.sort((a, b) => (due(a) < due(b) ? -1 : due(a) > due(b) ? 1 : a.order - b.order));
  else if (sort === 'status') out.sort((a, b) => STATUS_RANK[a.status] - STATUS_RANK[b.status] || (due(a) < due(b) ? -1 : 1));
  else if (sort === 'priority') out.sort((a, b) => PRIO_RANK[a.priority] - PRIO_RANK[b.priority] || (due(a) < due(b) ? -1 : 1));
  else out.sort((a, b) => (a.status === 'done') - (b.status === 'done') || a.order - b.order);
  return out;
}

function moveGroup(id, dir) {
  const st = app.state;
  const sorted = st.groups.slice().sort((a, b) => a.order - b.order);
  const i = sorted.findIndex((g) => g.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  const tmp = sorted[i];
  sorted[i] = sorted[j];
  sorted[j] = tmp;
  const orderOf = {};
  sorted.forEach((g, k) => (orderOf[g.id] = k + 1));
  commit(Object.assign({}, st, { groups: st.groups.map((g) => Object.assign({}, g, { order: orderOf[g.id] })) }));
}

function deleteGroup(id) {
  const st = app.state;
  const g = st.groups.find((x) => x.id === id);
  if (!g) return;
  const n = st.tasks.filter((t) => t.groupId === id).length;
  const doIt = () => {
    const ids = {};
    st.tasks.forEach((t) => {
      if (t.groupId === id) ids[t.id] = true;
    });
    commit(Object.assign({}, app.state, { groups: app.state.groups.filter((x) => x.id !== id), tasks: app.state.tasks.filter((t) => t.groupId !== id), lapses: app.state.lapses.filter((l) => !ids[l.taskId]) }), { undoable: true });
    toast('Group deleted.', { label: 'Undo', onclick: undo });
  };
  if (!n) doIt();
  else confirmModal('Delete this group?', 'The group "' + g.name + '" and its ' + n + (n === 1 ? ' task' : ' tasks') + ' will be deleted.', 'Delete group', doIt, true);
}

function viewTasks() {
  const st = app.state;
  const td = today();
  const f = app.ui.taskFilter;
  const filtering = !!(f.search || f.ownerId || f.clientId || f.status || f.special);
  const groups = st.groups.slice().sort((a, b) => a.order - b.order);
  let shown = 0;
  const blocks = groups.map((g) => {
    const list = sortTasks(
      st.tasks.filter((t) => t.groupId === g.id && taskMatches(t, f, td)),
      f.sort
    );
    shown += list.length;
    if (filtering && !list.length) return null;
    return groupBlock(g, list, td, filtering);
  });
  // Tasks whose group was removed still show, in a group of their own.
  const orphan = st.tasks.filter((t) => !groups.some((g) => g.id === t.groupId) && taskMatches(t, f, td));
  if (orphan.length) {
    shown += orphan.length;
    blocks.push(groupBlock({ id: '', name: 'No group', color: 5, order: 999 }, sortTasks(orphan, f.sort), td, filtering));
  }
  return h(
    'div',
    { class: 'view view-tasks' },
    tasksToolbar(td),
    !st.groups.length
      ? h('div', { class: 'empty' }, h('p', null, 'No groups yet. A group holds related tasks, for example one client.'), h('button', { class: 'btn btn-primary', type: 'button', onclick: addGroup }, 'Add the first group'))
      : filtering && !shown
        ? h('div', { class: 'empty' }, h('p', null, 'No tasks match these filters.'), h('button', { class: 'btn', type: 'button', onclick: () => setFilter({ search: '', ownerId: '', clientId: '', status: '', special: '' }) }, 'Clear filters'))
        : h('div', { class: 'groups-scroll', 'data-scroll': 'groups' }, h('div', { class: 'groups-inner' }, blocks))
  );
}

/** "25 Nov, 14:05" from an ISO time, in local time. */
function stampText(isoTime, td) {
  const d = new Date(isoTime);
  if (isNaN(d.getTime())) return '';
  const pad = (n) => (n < 10 ? '0' + n : '' + n);
  const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  return fmtShort(day, parts(td).y) + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function upcomingList(td, filter) {
  const tasks = upcoming(app.state, td, 7, filter);
  const events = app.state.events.filter((e) => e.date >= td && e.date <= addDays(td, 6) && (!filter.ownerId || !e.ownerId || e.ownerId === filter.ownerId));
  const items = tasks.map((t) => ({ date: t.due, time: '', kind: 'task', task: t })).concat(events.map((e) => ({ date: e.date, time: e.start || '', kind: 'event', ev: e })));
  items.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.kind === b.kind ? (a.time < b.time ? -1 : 1) : a.kind === 'event' ? -1 : 1));
  if (!items.length) return h('div', { class: 'empty empty-sm' }, h('p', null, 'No tasks or events in the next 7 days.'));
  const out = [];
  let last = '';
  items.slice(0, 12).forEach((it) => {
    if (it.date !== last) {
      last = it.date;
      const n = diffDays(td, it.date);
      out.push(h('div', { class: 'agenda-day' }, n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : fmtLong(it.date).slice(0, -5)));
    }
    if (it.kind === 'task') out.push(h('button', { class: 'agenda-item', type: 'button', onclick: () => openTask(it.task.id) }, h('span', { class: 'sdot st-' + it.task.status }), h('span', { class: 'agenda-title' }, it.task.title), avatar(findPerson(it.task.ownerId), 18)));
    else out.push(h('button', { class: 'agenda-item is-event', type: 'button', onclick: () => openEventModal(it.ev.id) }, h('span', { class: 'agenda-time num' }, it.ev.start || 'All day'), h('span', { class: 'agenda-title' }, it.ev.title)));
  });
  if (items.length > 12) out.push(h('button', { class: 'mini-more', type: 'button', onclick: () => setUi({ route: 'calendar' }) }, 'Open the calendar'));
  return h('div', { class: 'agenda' }, out);
}

function flowChart(td, filter, days) {
  const raw = flowSeries(app.state, td, days, filter);
  let points;
  let created;
  let completed;
  if (days > 30) {
    // Weekly totals keep a 90-day chart readable.
    const buckets = [];
    raw.forEach((p) => {
      const wk = startOfWeek(p.date);
      let b = buckets[buckets.length - 1];
      if (!b || b.wk !== wk) {
        b = { wk, created: 0, completed: 0 };
        buckets.push(b);
      }
      b.created += p.created;
      b.completed += p.completed;
    });
    points = buckets.map((b) => ({ label: fmtShort(b.wk), full: 'Week of ' + fmtLong(b.wk) }));
    created = buckets.map((b) => b.created);
    completed = buckets.map((b) => b.completed);
  } else {
    points = raw.map((p) => ({ label: fmtShort(p.date), full: fmtLong(p.date) }));
    created = raw.map((p) => p.created);
    completed = raw.map((p) => p.completed);
  }
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  return h(
    'div',
    null,
    legend([
      { label: 'Completed', color: C_DONE, line: true, value: sum(completed) },
      { label: 'Created', color: C_CREATED, line: true, value: sum(created) },
    ]),
    lineChart({ points, series: [{ name: 'Created', color: C_CREATED, values: created }, { name: 'Completed', color: C_DONE, values: completed }], height: 220, label: 'Tasks created and tasks completed over time' })
  );
}

function workloadBars(td, filter) {
  const tasks = filterTasks(app.state.tasks, { groupId: filter.groupId }).filter(isOpen);
  const people = app.state.people.map((p) => ({ id: p.id, name: p.name })).concat([{ id: '', name: 'Unassigned' }]);

      return {

        value: mine.length,

function insightRows(td, filter, max) {
  const money = bizInsights(app.state, td);
  const work = insights(app.state, td, filter).map((x) => Object.assign({ go: 'review' }, x));

  const rank = { bad: 0, warn: 1, good: 2, info: 3 };
  const all = money.concat(work).sort((a, b) => rank[a.tone] - rank[b.tone]);
  const list = all.slice(0, max || 6);
  if (!list.length) return h('div', { class: 'empty empty-sm' }, h('p', null, 'Not enough history yet. Findings show after a few tasks and invoices'));

function csvCell(v) {
  let sv = String(v === null || v === undefined ? '' : v);
  if (/^[=+\-@\t\r]/.test(sv)) sv = "'" + sv; // stop a spreadsheet from running the text as a formula
  return '"' + sv.replace(/"/g, '""') + '"';
}

/** True when the page runs in a host that blocks file downloads and the microphone (a shared preview page). */
function limitedHost() {
  return typeof window !== 'undefined' && window.__ZT_HOST__ === 'preview';
}

/** Save text as a file. In a host that blocks downloads, show the text with a Copy button. Returns true, false or 'shown'. */
function downloadText(filename, text, mime) {
  if (limitedHost()) {
    const ta = h('textarea', { class: 'input mono', rows: 12, readonly: true, 'aria-label': 'File content' });
    ta.value = text;
    openModal({
      title: filename,
      wide: true,
      body: [h('p', { class: 'modal-text' }, 'This preview page cannot save files. Copy the text and paste it in a new file with the name ' + filename + '. The live version saves the file directly.'), ta],
      actions: [
        { label: 'Close' },
        {
          label: 'Copy',
          kind: 'primary',
          keepOpen: true,
          onclick: () => {
            const fallback = () => {
              ta.focus();
              ta.select();
              toast('Press Ctrl+C or Cmd+C to copy.');
            };
            try {
              navigator.clipboard.writeText(text).then(() => toast('Copied.'), fallback);
            } catch (e) {
              fallback();
            }
          },
        },
      ],
    });
    return 'shown';
  }
  try {
    const blob = new Blob([text], { type: mime || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) {
    return false;
  }
}

function toCsv(header, rows) {
  return [header.map(csvCell).join(',')].concat(rows.map((r) => r.map(csvCell).join(','))).join('\r\n');
}

// Calendar screen: month grid with task due dates, follow-ups, events, and a preview of repeating tasks.








const MAX_CHIPS = 3;

/** Everything that shows on the calendar between two dates, grouped by date. */
function calendarItems(from, to) {
  const st = app.state;
  const show = app.ui.calShow;
  const who = app.ui.taskFilter.ownerId;
  const byDate = {};
  const put = (date, item) => {
    if (date < from || date > to) return;
    (byDate[date] = byDate[date] || []).push(item);
  };
  if (show.events) {
    st.events.forEach((e) => {
      if (who && e.ownerId && e.ownerId !== who) return;
      put(e.date, { kind: 'event', sort: '0' + (e.start || '00:00'), ev: e });
    });
  }
  if (show.tasks) {
    st.tasks.forEach((t) => {
      if (who && !isAssigned(t, who)) return;
      if (t.due) put(t.due, { kind: 'task', sort: '1' + (t.status === 'done' ? '9' : '0') + t.title, task: t });
      if (t.followUp && isOpen(t) && t.followUp !== t.due) put(t.followUp, { kind: 'follow', sort: '2' + t.title, task: t });
    });
  }
  if (show.tasks && show.repeats) {
    st.tasks.forEach((t) => {
      if (!t.recur || !t.due || !isOpen(t)) return;
      if (who && !isAssigned(t, who)) return;
      projectOccurrences(t, to, 40).forEach((d) => put(d, { kind: 'repeat', sort: '3' + t.title, task: t }));
    });
  }
  Object.keys(byDate).forEach((d) => byDate[d].sort((a, b) => (a.sort < b.sort ? -1 : 1)));
  return byDate;
}

function chip(item, date) {
  if (item.kind === 'event') {
    const e = item.ev;
    return h('button', { class: 'chip chip-event ev-' + e.type, type: 'button', title: (e.start ? e.start + ' ' : '') + e.title, onclick: (x) => { x.stopPropagation(); openEventModal(e.id); } }, e.start ? h('span', { class: 'chip-time num' }, e.start) : null, h('span', { class: 'chip-text' }, e.title));
  }
  const t = item.task;
  if (item.kind === 'repeat') {
    return h('button', { class: 'chip chip-repeat', type: 'button', title: 'Planned: ' + t.title + ' (' + recurText(t) + ')', onclick: (x) => { x.stopPropagation(); openTask(t.id); } }, icon('repeat', 11), h('span', { class: 'chip-text' }, t.title));
  }
  if (item.kind === 'follow') {
    return h('button', { class: 'chip chip-follow', type: 'button', title: 'Follow up: ' + t.title, onclick: (x) => { x.stopPropagation(); openTask(t.id); } }, icon('followup', 11), h('span', { class: 'chip-text' }, t.title));
  }
  return h(
    'button',
    {
      class: 'chip chip-task st-' + t.status,
      type: 'button',
      draggable: 'true',
      title: t.title + ' - ' + STATUS[t.status].label + '. Drag to another day to change the due date.',
      onclick: (x) => {
        x.stopPropagation();
        openTask(t.id);
      },
      ondragstart: (x) => {
        x.dataTransfer.setData('text/plain', t.id);
        x.dataTransfer.effectAllowed = 'move';
      },
    },
    h('span', { class: 'chip-bar' }),
    h('span', { class: 'chip-text' }, t.title)
  );
}

function dayCell(date, month, items, td, selected) {
  const p = parts(date);
  const inMonth = date.slice(0, 7) === month.slice(0, 7);
  const list = items || [];
  const shown = list.slice(0, MAX_CHIPS);
  const more = list.length - shown.length;
  const nTask = list.filter((i) => i.kind === 'task').length;
  const nEvent = list.filter((i) => i.kind === 'event').length;
  const cell = h(
    'div',
    {
      class: 'cal-cell' + (inMonth ? '' : ' is-out') + (date === td ? ' is-today' : '') + (date === selected ? ' is-selected' : '') + (dow(date) === 0 || dow(date) === 6 ? ' is-weekend' : ''),
      role: 'gridcell',
      'data-date': date,
      onclick: () => setUi({ calDay: date }),
      ondragover: (e) => {
        e.preventDefault();
        e.currentTarget.classList.add('is-drop');
      },
      ondragleave: (e) => e.currentTarget.classList.remove('is-drop'),
      ondrop: (e) => {
        e.preventDefault();
        e.currentTarget.classList.remove('is-drop');
        const id = e.dataTransfer.getData('text/plain');
        const task = app.state.tasks.find((t) => t.id === id);

// ---------- Assistant ----------

const QUICK_QUESTIONS = ['What do I do first today?', 'What is overdue?', 'What is stuck, and why?', 'What is due this week?', 'Who has the most work?', 'Why are my tasks late?', 'Which tasks repeat?'];

let chatLog = [];

function taskLine(t, td, extra) {
  const y = parts(td).y;
  const due = t.due ? (isOverdue(t, td) ? diffDays(t.due, td) + 'd late' : t.due === td ? 'today' : fmtShort(t.due, y)) : 'no date';
  return { text: t.title, meta: due + (extra ? ' · ' + extra : '') + (findPerson(t.ownerId) ? ' · ' + findPerson(t.ownerId).name : ''), taskId: t.id, status: t.status };
}

/** Answer a question from the task data. No AI: fixed rules, so the answer is always exact. */
function answerLocal(question, st, td, me) {
  const q = ' ' + question.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ') + ' ';
  const has = (...words) => words.some((w) => q.indexOf(' ' + w) !== -1);
  const open = st.tasks.filter(isOpen);
  const rank = { high: 0, medium: 1, low: 2 };
  const named = st.people.find((p) => q.indexOf(' ' + p.name.toLowerCase() + ' ') !== -1);
  const scope = named ? open.filter((t) => isAssigned(t, named.id)) : open;
  const whoText = named ? ' for ' + named.name : '';

  if (has('stuck', 'block')) {
    const list = scope.filter((t) => t.status === 'stuck');
    if (!list.length) return { title: 'No task is stuck' + whoText + '.', lines: [] };
    return {
      title: list.length + (list.length === 1 ? ' task is' : ' tasks are') + ' stuck' + whoText + ':',
      lines: list.map((t) => {
        const l = st.lapses.filter((x) => x.taskId === t.id && x.kind === 'stuck').sort((a, b) => (a.date < b.date ? 1 : -1))[0];
        return taskLine(t, td, l ? lapseLabel(l.reason) + (l.note ? ': ' + l.note : '') : 'no reason recorded');
      }),
    };
  }
  if (has('why', 'reason', 'slip', 'wrong', 'cause')) {
    const ls = lapseSummary(st, td, named ? { ownerId: named.id } : null, 90);
    const ins = insights(st, td, named ? { ownerId: named.id } : null);
    if (!ls.total) return { title: 'No reasons are recorded yet' + whoText + '.', lines: [], note: 'The tracker asks for a reason when a task goes to Stuck or is completed late.' };
    return { title: 'Reasons recorded in the last 90 days' + whoText + ':', lines: ls.rows.map((r) => ({ text: r.label, meta: r.total + (r.total === 1 ? ' time' : ' times') })).concat(ins.slice(0, 2).map((i) => ({ text: i.title, meta: i.detail }))) };
  }
  if (has('overdue', 'late', 'behind', 'missed')) {
    const list = scope.filter((t) => isOverdue(t, td)).sort((a, b) => (a.due < b.due ? -1 : 1));
    if (!list.length) return { title: 'Nothing is overdue' + whoText + '.', lines: [] };
    return { title: list.length + (list.length === 1 ? ' task is' : ' tasks are') + ' overdue' + whoText + ':', lines: list.map((t) => taskLine(t, td)) };
  }
  if (has('repeat', 'recur', 'bill', 'salary', 'commission', 'monthly', 'weekly')) {
    const list = scope.filter((t) => t.recur);
    if (!list.length) return { title: 'No repeating tasks' + whoText + '.', lines: [] };
    return { title: 'Repeating tasks' + whoText + ':', lines: list.map((t) => taskLine(t, td, recurLabel(t.recur) + (t.due ? ', then ' + fmtShort(nextDue(t.due, t.recur), parts(td).y) : ''))) };
  }
  if (has('who', 'workload', 'busy', 'most work')) {
    const rows = st.people.map((p) => {
      const mine = open.filter((t) => isAssigned(t, p.id));
      return { text: p.name, meta: mine.length + ' open · ' + mine.filter((t) => isOverdue(t, td)).length + ' overdue · ' + mine.filter((t) => t.status === 'stuck').length + ' stuck', n: mine.length };
    });
    rows.sort((a, b) => b.n - a.n);
    return { title: rows.length && rows[0].n ? rows[0].text + ' has the most open tasks.' : 'No open tasks.', lines: rows };
  }
  if (has('follow')) {
    const list = scope.filter((t) => followUpDue(t, td));
    if (!list.length) return { title: 'No follow-ups are due' + whoText + '.', lines: [] };
    return { title: 'Follow up on these today' + whoText + ':', lines: list.map((t) => taskLine(t, td)) };
  }
  if (has('week', 'upcoming', 'next', 'soon', 'coming')) {
    const list = scope.filter((t) => t.due && t.due >= td && t.due <= addDays(td, 6)).sort((a, b) => (a.due < b.due ? -1 : 1));
    const evs = st.events.filter((e) => e.date >= td && e.date <= addDays(td, 6)).sort((a, b) => (a.date < b.date ? -1 : 1));
    if (!list.length && !evs.length) return { title: 'Nothing is due in the next 7 days' + whoText + '.', lines: [] };
    return { title: 'Due in the next 7 days' + whoText + ':', lines: list.map((t) => taskLine(t, td)).concat(evs.map((e) => ({ text: e.title, meta: 'event · ' + fmtShort(e.date) + (e.start ? ' ' + e.start : '') }))) };
  }
  if (has('today', 'first', 'focus', 'priority', 'now', 'start', 'should')) {
    const who = named ? named.id : me;
    const mine = open.filter((t) => !who || isAssigned(t, who) || !t.ownerId);
    const list = mine.filter((t) => isOverdue(t, td) || t.due === td || followUpDue(t, td));
    list.sort((a, b) => rank[a.priority] - rank[b.priority] || ((a.due || '9') < (b.due || '9') ? -1 : 1));
    const p = findPerson(who);
    if (!list.length) return { title: 'Nothing is urgent today' + (p ? ' for ' + p.name : '') + '.', lines: upcoming(st, td, 3, who ? { ownerId: who } : null).map((t) => taskLine(t, td)), note: 'The next due tasks are listed.' };
    return { title: 'Do these first' + (p ? ', ' + p.name : '') + ' (high priority and oldest at the top):', lines: list.map((t) => taskLine(t, td, PRIORITY[t.priority].label.toLowerCase() + ' priority' + (followUpDue(t, td) ? ', follow up' : ''))) };
  }
  if (has('how many', 'count', 'summary', 'status', 'overview', 'numbers')) {
    const k = kpis(st, td, named ? { ownerId: named.id } : null, 30);
    return { title: 'Summary' + whoText + ':', lines: [{ text: 'Open tasks', meta: String(k.open) }, { text: 'Overdue', meta: String(k.overdue) }, { text: 'Stuck', meta: String(k.stuck) }, { text: 'Due today', meta: String(k.dueToday) }, { text: 'Completed in 30 days', meta: String(k.done) }, { text: 'Completed on time', meta: k.onTime === null ? 'no data' : k.onTime + '%' }] };
  }
  if (named) {
    return { title: named.name + ' has ' + scope.length + ' open tasks:', lines: scope.sort((a, b) => ((a.due || '9') < (b.due || '9') ? -1 : 1)).map((t) => taskLine(t, td)) };
  }
  // Search the task text for the words of the question.
  const words = q.trim().split(/\s+/).filter((w) => w.length > 2 && ['the', 'and', 'for', 'what', 'when', 'which', 'are', 'task', 'tasks', 'with', 'about', 'show', 'have', 'does'].indexOf(w) === -1);
  if (words.length) {
    const hits = st.tasks.filter((t) => words.some((w) => (t.title + ' ' + t.remarks).toLowerCase().indexOf(w) !== -1));
    if (hits.length) return { title: hits.length + (hits.length === 1 ? ' task matches' : ' tasks match') + ' "' + words.join(' ') + '":', lines: hits.slice(0, 12).map((t) => taskLine(t, td, STATUS[t.status].label.toLowerCase())) };
  }
  return { title: 'I do not have an answer for that question.', lines: [], note: 'Ask about: today, overdue, stuck, this week, workload, reasons for delay, repeating tasks, or a client name.' };
}

// ---------- Voice (built into the browser, free) ----------

function speechCtor() {
  if (limitedHost()) return null;
  return typeof window !== 'undefined' ? window.SpeechRecognition || window.webkitSpeechRecognition || null : null;
}

let listening = false;
let speakReplies = false;

function speak(text) {
  try {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    window.speechSynthesis.cancel();
    const u = new window.SpeechSynthesisUtterance(text);
    u.lang = 'en-SG';
    u.rate = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {
    /* speech is optional */
  }
}

function answerAsSpeech(a) {
  const lines = a.lines.slice(0, 4).map((l) => l.text + (l.meta ? ', ' + l.meta.split(' · ')[0] : ''));
  return a.title + ' ' + lines.join('. ') + (a.lines.length > 4 ? '. And ' + (a.lines.length - 4) + ' more.' : '');
}

function startListening() {
  const Ctor = speechCtor();
  if (!Ctor || listening) return;
  let rec;
  try {
    rec = new Ctor();
  } catch (e) {
    toast('Voice input is not available in this browser.');
    return;
  }
  rec.lang = 'en-SG';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onresult = (ev) => {

  };
  rec.onerror = (ev) => {

    toast(code === 'not-allowed' || code === 'service-not-allowed' ? 'The browser blocked the microphone. Allow the microphone for this page.' : code === 'no-speech' ? 'No speech was heard. Try again.' : 'Voice input did not work. Type the question.');
  };

  };

  }
}

function ask(question, byVoice) {
  const qv = question.trim();
  if (!qv) return;
  const td = today();
  const entry = { q: qv, a: null, ai: '', pending: false, err: '' };
  chatLog.push(entry);
  const aiOn = app.mode === 'google' && app.boot && app.boot.ai;
  entry.a = answerLocal(qv, app.state, td, meId());
  if (byVoice || speakReplies) speak(answerAsSpeech(entry.a));
  if (aiOn) {
    entry.pending = true;
    backend('apiAsk', qv)
      .then((res) => {
        entry.pending = false;
        entry.ai = (res && res.text) || '';
        entry.err = res && res.error ? res.error : '';
        refresh();
      })
      .catch((e) => {
        entry.pending = false;
        entry.err = String(e.message || e);
        refresh();
      });
  }
  refresh();
  setTimeout(() => {
    const el = document.querySelector('.chat-log');
    if (el) el.scrollTop = el.scrollHeight;
  }, 30);
}

/** Pick an image file, cut it to a square of 96 pixels, and save it as the photo of the person. */
function pickPhoto(p) {
  const input = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) {
      toast('This image is too large. Use an image below 15 MB');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => toast('The image did not load');
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => toast('This file is not an image that the browser can read');
      img.onload = () => {
        try {
          const size = 96;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const side = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          let data = canvas.toDataURL('image/jpeg', 0.85);
          if (data.length > 40000) data = canvas.toDataURL('image/jpeg', 0.6);
          const clean = cleanPhoto(data);
          if (!clean) {
            toast('The photo did not convert. Try another image');
            return;
          }
          patchPerson(p.id, { photo: clean });
          toast('Photo saved for ' + p.name);
        } catch (e) {
          toast('The photo did not convert. Try another image');
        }
      };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
  input.click();
}

function openInvoiceModal(invoiceId, presetClientId) {
  const st = app.state;
  const td = today();
  const sym = currencySymbol();
  const existing = invoiceId ? st.invoices.find((v) => v.id === invoiceId) : null;
  const terms = Number(st.settings.invoiceTermsDays) || 14;
  const inv = existing ? JSON.parse(JSON.stringify(existing)) : makeInvoice({ number: nextInvoiceNumber(st), clientId: presetClientId || '', issueDate: td, dueDate: addDays(td, terms), items: [{ desc: '', qty: 1, rate: 0 }] });
  if (!inv.items.length) inv.items.push({ desc: '', qty: 1, rate: 0 });

  const number = h('input', { class: 'input', type: 'text', value: inv.number, 'aria-label': 'Invoice number' });
  const client = clientSelect(inv.clientId, null, 'Select a client');
  const title = h('input', { class: 'input', type: 'text', value: inv.title, placeholder: 'Example: Monthly retainer', 'data-autofocus': existing ? null : '', 'aria-label': 'Title' });
  const issue = h('input', { class: 'input', type: 'date', value: inv.issueDate, 'aria-label': 'Issue date' });
  const due = h('input', { class: 'input', type: 'date', value: inv.dueDate, 'aria-label': 'Due date' });
  const notes = h('textarea', { class: 'input', rows: 2, placeholder: 'Note for the client', 'aria-label': 'Notes' });
  notes.value = inv.notes;
  const err = h('p', { class: 'field-err', hidden: true }, '');
  const totalEl = h('strong', { class: 'num' }, '');
  const itemsEl = h('div', { class: 'items' });

  const readItems = () => {
    const out = [];
    itemsEl.querySelectorAll('.item-row').forEach((row) => {
      const ins = row.querySelectorAll('input');
      out.push({ desc: ins[0].value.trim(), qty: Number(ins[1].value) || 0, rate: round2(ins[2].value) });
    });
    return out;
  };
  const drawTotal = () => {
    const items = readItems();
    itemsEl.querySelectorAll('.item-row').forEach((row, i) => (row.querySelector('.item-amount').textContent = money(items[i].qty * items[i].rate, sym)));
    totalEl.textContent = money(items.reduce((s, it) => s + it.qty * it.rate, 0), sym);
  };
  const drawItems = (items, focusLast) => {
    while (itemsEl.firstChild) itemsEl.removeChild(itemsEl.firstChild);
    itemsEl.appendChild(h('div', { class: 'item-head' }, h('span', null, 'Description'), h('span', null, 'Qty'), h('span', null, 'Rate'), h('span', null, 'Amount'), h('span', null)));
    items.forEach((it, i) => {
      itemsEl.appendChild(
        h(
          'div',
          { class: 'item-row' },
          h('input', { class: 'input', type: 'text', value: it.desc, placeholder: 'What you did', 'aria-label': 'Description of line ' + (i + 1) }),
          h('input', { class: 'input', type: 'number', min: 0, step: 'any', value: it.qty, 'aria-label': 'Quantity of line ' + (i + 1), oninput: drawTotal }),
          h('input', { class: 'input', type: 'number', min: 0, step: 'any', value: it.rate, 'aria-label': 'Rate of line ' + (i + 1), oninput: drawTotal }),
          h('span', { class: 'item-amount num' }, ''),
          h('button', { class: 'icon-btn icon-btn-sm', type: 'button', 'aria-label': 'Remove line ' + (i + 1), disabled: items.length === 1, onclick: () => { const cur = readItems(); cur.splice(i, 1); drawItems(cur); } }, icon('x', 13))
        )
      );
    });
    drawTotal();
    if (focusLast) {
      const rows = itemsEl.querySelectorAll('.item-row');
      rows[rows.length - 1].querySelector('input').focus();
    }
  };
  drawItems(inv.items);

  const collect = () => {
    const items = readItems().filter((it) => it.desc || it.rate);
    if (!number.value.trim()) return 'Enter the invoice number';
    if (st.invoices.some((v) => v.number === number.value.trim() && (!existing || v.id !== existing.id))) return 'This invoice number is in use';
    if (!client.value) return 'Select a client';
    if (!items.length) return 'Add 1 line or more';
    if (items.some((it) => it.qty < 0 || it.rate < 0)) return 'A quantity or a rate is below zero';
    if (!isDateStr(issue.value)) return 'Enter the issue date';
    if (due.value && !isDateStr(due.value)) return 'The due date is not valid';
    if (due.value && due.value < issue.value) return 'The due date is before the issue date';
    return Object.assign({}, inv, { number: number.value.trim(), clientId: client.value, title: title.value.trim(), issueDate: issue.value, dueDate: due.value, items, notes: notes.value.trim() });
  };
  const save = (then) => {
    const res = collect();
    if (typeof res === 'string') {
      err.textContent = res;
      err.hidden = false;
      return false;
    }
    if (existing) patchList('invoices', existing.id, res);
    else commit(Object.assign({}, app.state, { invoices: app.state.invoices.concat([res]) }), { undoable: true });
    toast(existing ? 'Invoice saved' : 'Invoice ' + res.number + ' added as a draft');
    if (then) setTimeout(() => then(res), 0);
    return true;
  };

  const actions = [{ label: 'Cancel' }, { label: 'Save and preview', onclick: () => save(openInvoicePreview) }, { label: existing ? 'Save' : 'Add invoice', kind: 'primary', onclick: () => save() }];

      kind: 'danger',
      onclick: () => {
        removeFrom('invoices', existing.id, 'Invoice ' + existing.number);
        return true;
      },
    });
  openModal({
    title: existing ? 'Invoice ' + existing.number : 'New invoice',
    wide: true,
    body: [
      h('div', { class: 'field-row' }, h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Client'), client), h('div', { class: 'field field-narrow' }, h('label', { class: 'field-label' }, 'Number'), number)),
      h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Title'), title),
      h('div', { class: 'field-row' }, h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Issue date'), issue), h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Due date'), due)),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Lines'), itemsEl, h('div', { class: 'items-foot' }, h('button', { class: 'btn btn-sm', type: 'button', onclick: () => drawItems(readItems().concat([{ desc: '', qty: 1, rate: 0 }]), true) }, icon('plus', 13), 'Add line'), h('span', { class: 'items-total' }, 'Total ', totalEl))),
      h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Note'), notes),
      err,
    ],
    actions,
  });
}

function openExpenseModal(expenseId, preset) {
  const st = app.state;
  const td = today();
  const existing = expenseId ? st.expenses.find((x) => x.id === expenseId) : null;
  const x = existing || makeExpense(Object.assign({ date: td }, preset || {}));
  const date = h('input', { class: 'input', type: 'date', value: x.date, 'aria-label': 'Date' });
  const vendor = h('input', { class: 'input', type: 'text', value: x.vendor, placeholder: 'Example: Meta Ads', 'data-autofocus': existing ? null : '', 'aria-label': 'Paid to' });
  const amount = h('input', { class: 'input', type: 'number', min: 0, step: 'any', value: existing ? x.amount : '', placeholder: '0.00', 'aria-label': 'Amount' });
  const cat = h('select', { class: 'input', 'aria-label': 'Category' }, EXPENSE_CATS.map((c) => h('option', { value: c.id, selected: c.id === x.category }, c.label)));
  const client = clientSelect(x.clientId, null, 'Not for one client');
  const note = h('input', { class: 'input', type: 'text', value: x.note, placeholder: 'Optional', 'aria-label': 'Note' });
  const err = h('p', { class: 'field-err', hidden: true }, '');
  const save = () => {
    const amt = round2(amount.value);
    const bad = !vendor.value.trim() ? 'Enter who you paid' : !(amt > 0) ? 'Enter an amount above zero' : !isDateStr(date.value) ? 'Enter the date' : '';
    if (bad) {
      err.textContent = bad;
      err.hidden = false;
      return false;
    }
    const fields = { date: date.value, vendor: vendor.value.trim(), amount: amt, category: cat.value, clientId: client.value, note: note.value.trim() };
    if (existing) patchList('expenses', existing.id, fields);
    else commit(Object.assign({}, app.state, { expenses: app.state.expenses.concat([Object.assign({}, x, fields)]) }), { undoable: true });
    toast(existing ? 'Expense saved' : 'Expense added');
    return true;
  };
  [vendor, amount, note].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && save()) closeModal(); }));
  const actions = [{ label: 'Cancel' }, { label: existing ? 'Save' : 'Add expense', kind: 'primary', onclick: save }];
  if (existing)
    actions.unshift({
      label: 'Delete',
      kind: 'danger',
      onclick: () => {
        removeFrom('expenses', existing.id, 'Expense');
        return true;
      },
    });
  openModal({
    title: existing ? 'Edit expense' : 'Log an expense',
    body: [
      h('div', { class: 'field-row' }, h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Paid to'), vendor), h('div', { class: 'field field-narrow' }, h('label', { class: 'field-label' }, 'Amount (' + currencySymbol() + ')'), amount)),
      h('div', { class: 'field-row' }, h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Category'), cat), h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Date'), date)),
      h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Client'), client, h('p', { class: 'set-hint' }, 'A cost with a client counts in the return of that client')),
      h('div', { class: 'field' }, h('label', { class: 'field-label' }, 'Note'), note),
      err,
    ],
    actions,
  });
}

function patchNote(id, patch) {
  const st = app.state;
  commit(Object.assign({}, st, { notes: st.notes.map((n) => (n.id === id ? Object.assign({}, n, patch, { updatedAt: new Date().toISOString() }) : n)) }));
}

function addNote(preset) {
  const st = app.state;
  const n = makeNote(Object.assign({ title: '' }, preset || {}));
  commit(Object.assign({}, st, { notes: st.notes.concat([n]) }), { undoable: true });
  setUi({ route: 'notes', noteId: n.id, noteSearch: '' });
  setTimeout(() => {
    const el = document.querySelector('[data-fk="note-title-' + n.id + '"]');
    if (el) el.focus();
  }, 120);
}

function sortedNotes(st, q) {
  const s = (q || '').toLowerCase();
  return st.notes
    .filter((n) => !s || (n.title + ' ' + n.body).toLowerCase().indexOf(s) !== -1)
    .sort((a, b) => (a.pinned === b.pinned ? (a.updatedAt < b.updatedAt ? 1 : -1) : a.pinned ? -1 : 1));
}

function saveSalesDay(date, ownerId, patch) {
  const st = app.state;
  const id = salesDayId(date, ownerId);
  const old = st.sales.find((d) => d.id === id);
  const next = Object.assign({}, old || makeSalesDay({ date, ownerId }), patch);
  TALLY.forEach((t) => (next[t.key] = Math.max(0, Math.round(Number(next[t.key]) || 0))));
  next.value = Math.max(0, round2(next.value));
  const empty = !next.leads && !next.contacted && !next.booked && !next.closed && !next.value && !next.note;
  const list = old ? (empty ? st.sales.filter((d) => d.id !== id) : st.sales.map((d) => (d.id === id ? next : d))) : empty ? st.sales : st.sales.concat([next]);
  commit(Object.assign({}, st, { sales: list }));
}

// Sheets screen: a full spreadsheet inside the tracker, for free-form work (commission tracker, budgets, lists).
// The engine is Univer (open source, Apache-2.0). It is large, so it loads from the public npm CDN
// only when this screen opens. The tracker works without it.




const UNIVER_VERSION = '1.4.0';
const CDN_BASE = 'https://cdn.jsdelivr.net/npm/';
const UNIVER_FIRST = ['react@18.3.1/umd/react.production.min.js', 'react-dom@18.3.1/umd/react-dom.production.min.js'];
const UNIVER_PACKAGES = ['themes', 'protocol', 'core', 'network', 'rpc', 'design', 'engine-render', 'engine-formula', 'drawing', 'telemetry', 'ui', 'docs', 'docs-ui', 'sheets', 'sheets-ui', 'sheets-formula', 'sheets-formula-ui', 'sheets-numfmt', 'sheets-numfmt-ui'];
const UNIVER_FACADES = ['core', 'engine-formula', 'ui', 'docs', 'docs-ui', 'sheets', 'sheets-ui', 'sheets-formula', 'sheets-numfmt'];
const UNIVER_LOCALES = ['design', 'ui', 'docs-ui', 'engine-formula', 'sheets', 'sheets-ui', 'sheets-formula', 'sheets-formula-ui', 'sheets-numfmt-ui'];
const LS_BOOK = 'zt.book.v1';

function univerUrls() {
  const u = (p, file) => CDN_BASE + '@univerjs/' + p + '@' + UNIVER_VERSION + '/lib/umd/' + file;
  return ['rxjs@7.8.2/dist/bundles/rxjs.umd.min.js', '@wendellhu/redi@1.1.3/dist/umd/index.js', '@wendellhu/redi@1.1.3/dist/umd/react-bindings/index.js']
    .map((x) => CDN_BASE + x)
    .concat(
      UNIVER_PACKAGES.map((p) => u(p, 'index.js')),
      UNIVER_FACADES.map((p) => u(p, 'facade.js')),
      UNIVER_LOCALES.map((p) => u(p, 'locale/en-US.js'))
    );
}

/** Add script tags. The files download together and run in the given order. */
function loadScriptList(urls) {
  return new Promise((resolve, reject) => {
    let left = urls.length;
    let failed = false;
    urls.forEach((src) => {
      const el = document.createElement('script');
      el.src = src;
      el.async = false;
      el.onload = () => {
        left--;
        if (!left && !failed) resolve();
      };
      el.onerror = () => {
        if (failed) return;
        failed = true;
        reject(new Error('A file of the spreadsheet engine did not load: ' + src.replace(CDN_BASE, '')));
      };
      document.head.appendChild(el);
    });
  });
}

function loadUniverCss() {
  if (document.getElementById('zt-univer-css')) return Promise.resolve();
  return new Promise((resolve) => {
    const link = document.createElement('link');
    link.id = 'zt-univer-css';
    link.rel = 'stylesheet';
    link.href = CDN_BASE + '@univerjs/preset-sheets-core@' + UNIVER_VERSION + '/lib/index.css';
    link.onload = () => resolve();
    link.onerror = () => resolve();
    document.head.appendChild(link);
    setTimeout(resolve, 8000);
  });
}

let univerLoading = null;
function loadUniver() {
  if (univerLoading) return univerLoading;
  univerLoading = loadScriptList(UNIVER_FIRST.map((x) => CDN_BASE + x))
    .then(() => {
      // The React 18 browser build has no JSX runtime. The Univer browser files need these 2 functions.
      const R = window.React;
      if (!R.jsx) {
        R.jsx = (type, props, key) => R.createElement(type, key === undefined ? props : Object.assign({}, props, { key }));
        R.jsxs = R.jsx;
      }
      return loadScriptList(univerUrls());
    })
    .then(loadUniverCss)
    .then(() => {
      if (!window.UniverCore || !window.UniverCoreFacade || !window.UniverSheetsUi) throw new Error('The spreadsheet engine did not start.');
    });
  univerLoading.catch(() => {
    univerLoading = null;
  });
  return univerLoading;
}

/** The first workbook: a commission tracker and a bills list, with live formulas. */
function sampleBook() {
  const head = { bl: 1 };
  const toCells = (rows, boldRows) => {
    const out = {};
    rows.forEach((row, r) => {
      out[r] = {};
      row.forEach((v, c) => {
        if (v === '') return;
        const cell = typeof v === 'string' && v[0] === '=' ? { f: v } : { v };
        if (boldRows.indexOf(r) !== -1) cell.s = head;
        out[r][c] = cell;
      });
    });
    return out;
  };
  const commission = [
    ['Commission tracker', '', '', '', '', ''],
    ['Month', 'Client', 'Deal', 'Deal value ($)', 'Rate', 'Commission ($)'],
    ['Nov 2026', 'Glow Skincare', 'Launch campaign', 4800, 0.1, '=D3*E3'],
    ['Nov 2026', 'Fitlab', '30-day challenge', 3200, 0.1, '=D4*E4'],
    ['Nov 2026', 'Kedai Kopi Aman', 'Hari Raya campaign', 1200, 0.08, '=D5*E5'],
    ['Dec 2026', 'Rumah Batik', 'Rebrand (proposal)', 6500, 0.1, '=D6*E6'],
    ['', '', 'Total', '=SUM(D3:D6)', '', '=SUM(F3:F6)'],
  ];
  const bills = [
    ['Monthly bills', '', ''],
    ['Item', 'Amount ($)', 'Due day'],
    ['Canva Pro', 18, 5],
    ['Adobe Creative Cloud', 62, 5],
    ['Meta Verified', 15, 5],
    ['Freelancer: video editor', 600, 30],
    ['Freelancer: designer', 450, 30],
    ['Total', '=SUM(B3:B7)', ''],
  ];
  const widths = (list) => {
    const o = {};
    list.forEach((w, i) => (o[i] = { w }));
    return o;
  };
  return {
    id: 'zt-book',
    name: 'Tracker sheets',
    sheetOrder: ['commission', 'bills'],
    styles: {},
    sheets: {
      commission: { id: 'commission', name: 'Commission', rowCount: 200, columnCount: 14, cellData: toCells(commission, [0, 1, 6]), columnData: widths([100, 170, 200, 120, 70, 130]) },
      bills: { id: 'bills', name: 'Bills', rowCount: 200, columnCount: 10, cellData: toCells(bills, [0, 1, 7]), columnData: widths([220, 110, 90]) },
    },

function loadBook() {
  if (app.mode === 'google') {
    return backend('apiLoadBook').then((res) => {
      try {
        return res && res.json ? JSON.parse(res.json) : null;
      } catch (e) {
        return null;
      }
    });
  }
  try {
    const raw = window.localStorage.getItem(LS_BOOK);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  } catch (e) {
    return Promise.resolve(null);
  }
}

function saveBook(snapshot) {
  if (!snapshot) return Promise.resolve(false);
  const json = JSON.stringify(snapshot);
  if (app.mode === 'google') return backend('apiSaveBook', json).then(() => true);
  try {
    window.localStorage.setItem(LS_BOOK, json);
    return Promise.resolve(true);
  } catch (e) {
    return Promise.resolve(false);
  }
}

// ---------- The screen ----------

const sheet = { status: 'idle', error: '', univer: null, api: null, off: null, timer: 0, host: null, label: null, run: 0 };

function setSheetLabel(text, tone) {
  if (!sheet.label) return;
  sheet.label.textContent = text;
  sheet.label.className = 'sheet-status' + (tone ? ' is-' + tone : '');
}

function snapshotNow() {
  try {
    const wb = sheet.api && sheet.api.getActiveWorkbook();
    return wb ? wb.save() : null;
  } catch (e) {
    return null;
  }
}

function saveSheetNow() {
  const snap = snapshotNow();
  if (!snap) return;
  setSheetLabel('Saving...');
  saveBook(snap).then(
    (ok) => {
      const d = new Date();
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      setSheetLabel(ok ? 'Saved ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : 'Not saved: this browser blocks storage', ok ? 'ok' : 'bad');
    },
    (e) => setSheetLabel('Not saved: ' + ((e && e.message) || e), 'bad')
  );
}

function mountUniver(host, snapshot) {
  const C = window.UniverCore;
  const en = C.LocaleType.EN_US;
  const locales = {};
  locales[en] = C.mergeLocales(window.UniverDesignEnUS, window.UniverUiEnUS, window.UniverDocsUiEnUS, window.UniverEngineFormulaEnUS, window.UniverSheetsEnUS, window.UniverSheetsUiEnUS, window.UniverSheetsFormulaEnUS, window.UniverSheetsFormulaUiEnUS, window.UniverSheetsNumfmtUiEnUS);
  const univer = new C.Univer({ locale: en, darkMode: true, locales });
  univer.registerPlugin(window.UniverEngineRender.UniverRenderEnginePlugin);
  univer.registerPlugin(window.UniverEngineFormula.UniverFormulaEnginePlugin);
  univer.registerPlugin(window.UniverUi.UniverUIPlugin, { container: host });
  univer.registerPlugin(window.UniverDocs.UniverDocsPlugin);
  univer.registerPlugin(window.UniverDocsUi.UniverDocsUIPlugin);
  univer.registerPlugin(window.UniverSheets.UniverSheetsPlugin);
  univer.registerPlugin(window.UniverSheetsUi.UniverSheetsUIPlugin);
  univer.registerPlugin(window.UniverSheetsFormula.UniverSheetsFormulaPlugin);
  univer.registerPlugin(window.UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin);
  univer.registerPlugin(window.UniverSheetsNumfmt.UniverSheetsNumfmtPlugin);
  univer.registerPlugin(window.UniverSheetsNumfmtUi.UniverSheetsNumfmtUIPlugin);
  const api = window.UniverCoreFacade.FUniver.newAPI(univer);
  api.createWorkbook(snapshot || sampleBook());
  sheet.univer = univer;
  sheet.api = api;
  sheet.off = api.addEvent(api.Event.CommandExecuted, (e) => {
    if (!e || e.type !== C.CommandType.MUTATION) return; // data changes only, not selection or scroll
    clearTimeout(sheet.timer);
    setSheetLabel('Changes not saved yet');
    sheet.timer = setTimeout(saveSheetNow, 900);
  });
}

function startSheet() {
  const run = ++sheet.run;
  sheet.status = 'loading';
  sheet.error = '';
  loadUniver()
    .then(loadBook)
    .then((book) => {
      if (run !== sheet.run || app.ui.route !== 'sheets' || !sheet.host || !document.body.contains(sheet.host)) {
        if (run === sheet.run) sheet.status = 'idle';
        return;
      }
      mountUniver(sheet.host, book);
      sheet.status = 'ready';
      sheet.host.classList.add('is-ready');
      setSheetLabel(book ? 'Saved' : 'Sample sheet. Changes save by themselves.', 'ok');
    })
    .catch((e) => {
      if (run !== sheet.run) return;
      sheet.status = 'error';
      sheet.error = String((e && e.message) || e);
      refresh();
    });
}

/** Save and remove the spreadsheet. The app calls this when the user leaves the Sheets screen. */
function closeSheets() {
  if (sheet.status === 'idle') return;
  sheet.run++;
  clearTimeout(sheet.timer);
  if (sheet.status === 'ready') {
    const snap = snapshotNow();
    if (snap) saveBook(snap).catch(() => {});
    try {
      if (sheet.off && sheet.off.dispose) sheet.off.dispose();
      sheet.univer.dispose();
    } catch (e) {
      /* the engine is already gone */
    }
  }
  try {
    document.documentElement.classList.remove('univer-dark');
  } catch (e) {
    /* no document */
  }
  sheet.univer = null;
  sheet.api = null;
  sheet.off = null;
  sheet.host = null;
  sheet.label = null;
  sheet.status = 'idle';
}

function viewSheets() {
  // The host element stays the same between redraws, so the spreadsheet is not rebuilt.
  if (!sheet.host) sheet.host = h('div', { class: 'sheet-host' }, h('p', { class: 'sheet-wait' }, 'Loading the spreadsheet engine. The first time takes some seconds (about 3 MB).'));
  if (!sheet.label) sheet.label = h('span', { class: 'sheet-status', role: 'status' }, '');
  if (sheet.status === 'idle') startSheet();
  const failed = sheet.status === 'error';
  return h(
    'div',
    { class: 'view view-sheets' },
    h(
      'div',
      { class: 'toolbar' },
      h('p', { class: 'sheet-intro' }, 'A spreadsheet for free-form work: commission, budgets, lists. Formulas work. ', app.mode === 'google' ? 'It saves to your Google Sheet file.' : 'In this demo it saves in this browser.'),
      h('div', { class: 'toolbar-end' }, sheet.label)
    ),
    failed
      ? h(
          'div',
          { class: 'empty' },
          h('p', null, 'The spreadsheet did not load. It needs an internet connection the first time.'),
          h('p', { class: 'set-hint' }, sheet.error),
          h(
            'button',
            {
              class: 'btn btn-primary',
              type: 'button',
              onclick: () => {
                sheet.status = 'idle';
                sheet.host = null;
                refresh();
              },
            },
            icon('undo', 15),
            'Try again'
          )
        )
      : sheet.host
  );
}
