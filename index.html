<script>
(function () {
"use strict";
// ---- core/dates.js ----
// Date helpers. All dates are plain strings in the form YYYY-MM-DD (local calendar days).
// No time zones are stored. This keeps the browser and the Google Apps Script backend in agreement.

function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

/** Make a YYYY-MM-DD string from year, month (1-12), day. Overflow is normalised. */
function ymd(y, m, d) {
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate());
}

function isDateStr(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const p = parts(s);
  return ymd(p.y, p.m, p.d) === s;
}

function parts(s) {
  return { y: +s.slice(0, 4), m: +s.slice(5, 7), d: +s.slice(8, 10) };
}

function toUTC(s) {
  const p = parts(s);
  return Date.UTC(p.y, p.m - 1, p.d);
}

/** Today's local calendar date as YYYY-MM-DD. */
function todayStr(now) {
  const n = now || new Date();
  return n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(n.getDate());
}

function addDays(s, n) {
  const p = parts(s);
  return ymd(p.y, p.m, p.d + n);
}

function daysInMonth(y, m) {
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}

/** Add months. The day is clamped to the month length. Pass anchorDay to keep "the 31st" stable. */
function addMonths(s, n, anchorDay) {
  const p = parts(s);
  const total = p.y * 12 + (p.m - 1) + n;
  const y = Math.floor(total / 12);
  const m = (total % 12) + 1;
  const want = anchorDay || p.d;
  return ymd(y, m, Math.min(want, daysInMonth(y, m)));
}

/** Whole days from a to b (b - a). Negative when b is before a. */
function diffDays(a, b) {
  return Math.round((toUTC(b) - toUTC(a)) / 86400000);
}

/** Day of week, 0 = Sunday ... 6 = Saturday. */
function dow(s) {
  return new Date(toUTC(s)).getUTCDay();
}

/** Monday of the week that holds s. */
function startOfWeek(s) {
  const d = dow(s);
  return addDays(s, d === 0 ? -6 : 1 - d);
}

function startOfMonth(s) {
  return s.slice(0, 8) + '01';
}

function endOfMonth(s) {
  const p = parts(s);
  return ymd(p.y, p.m, daysInMonth(p.y, p.m));
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/** "25 Nov" or "25 Nov 2027" when the year differs from refYear. */
function fmtShort(s, refYear) {
  if (!s) return '';
  const p = parts(s);
  const base = p.d + ' ' + MONTHS[p.m - 1];
  return refYear && p.y !== refYear ? base + ' ' + p.y : base;
}

/** "Wed 25 Nov 2026" */
function fmtLong(s) {
  if (!s) return '';
  const p = parts(s);
  return DOWS[dow(s)] + ' ' + p.d + ' ' + MONTHS[p.m - 1] + ' ' + p.y;
}

/** Human distance from today: "Today", "Tomorrow", "in 3 days", "2 days late". */
function relDay(s, today) {
  const n = diffDays(today, s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n > 1) return 'in ' + n + ' days';
  return -n + ' days ago';
}

/** The 6-week grid (42 days, Monday first) that shows the month of s. */
function monthGrid(s) {
  const first = startOfMonth(s);
  const start = startOfWeek(first);
  const out = [];
  for (let i = 0; i < 42; i++) out.push(addDays(start, i));
  return out;
}

// ---- core/model.js ----
// Data model and the rules that change it. Pure functions only: no DOM, no storage, no network.
// The browser app and the Google Apps Script backend both use this file.



const STATUS = {
  not_started: { id: 'not_started', label: 'Not started', short: 'To do' },
  in_progress: { id: 'in_progress', label: 'In progress', short: 'Working' },
  stuck: { id: 'stuck', label: 'Stuck', short: 'Stuck' },
  done: { id: 'done', label: 'Completed', short: 'Done' },
};
const STATUS_ORDER = ['not_started', 'in_progress', 'stuck', 'done'];

const PRIORITY = {
  high: { id: 'high', label: 'High' },
  medium: { id: 'medium', label: 'Medium' },
  low: { id: 'low', label: 'Low' },
};
const PRIORITY_ORDER = ['high', 'medium', 'low'];

// Reasons a task was late or stuck. The id is stored. The label is shown.
const LAPSE_REASONS = [
  { id: 'waiting_client', label: 'Waiting for client' },
  { id: 'waiting_other', label: 'Waiting for someone else' },
  { id: 'underestimated', label: 'Took longer than planned' },
  { id: 'overloaded', label: 'Too many tasks at once' },
  { id: 'forgot', label: 'Forgot or missed it' },
  { id: 'unclear', label: 'Brief was not clear' },
  { id: 'money', label: 'Budget or payment problem' },
  { id: 'tools', label: 'Tool or access problem' },
  { id: 'other', label: 'Other' },
];
function lapseLabel(id) {
  const r = LAPSE_REASONS.find((x) => x.id === id);
  return r ? r.label : 'Other';
}

const RECUR_FREQ = [
  { id: 'daily', label: 'Daily', unit: 'day' },
  { id: 'weekly', label: 'Weekly', unit: 'week' },
  { id: 'monthly', label: 'Monthly', unit: 'month' },
  { id: 'yearly', label: 'Yearly', unit: 'year' },
];

const EVENT_TYPES = [
  { id: 'meeting', label: 'Meeting' },
  { id: 'event', label: 'Event' },
  { id: 'deadline', label: 'Key date' },
  { id: 'personal', label: 'Personal' },
];

// The person who makes the changes on this device. Used for the activity history only.
let currentActor = '';
function setActor(id) {
  currentActor = id || '';
}

const HISTORY_MAX = 40;
/** Add one line to the activity history of a task. Returns a new array. */
function withHistory(task, what) {
  const list = (task.history || []).concat([{ at: new Date().toISOString(), by: currentActor, what }]);
  return list.length > HISTORY_MAX ? list.slice(list.length - HISTORY_MAX) : list;
}

/** How many times the due date of a task was moved to a later or earlier date. */
function dueMoves(task) {
  return (task.history || []).filter((x) => x.what.indexOf('Due date moved') === 0).length;
}

let idCounter = 0;
/** Short unique id. Safe for 2 people who write at the same time. */
function newId(prefix) {
  idCounter = (idCounter + 1) % 1296;
  const rand = Math.floor(Math.random() * 46656 * 36).toString(36);
  return (prefix || 'x') + '_' + Date.now().toString(36) + idCounter.toString(36) + rand;
}

// ---------- Business records: clients, invoices, expenses, notes ----------

const CLIENT_STATUS = [
  { id: 'lead', label: 'Lead' },
  { id: 'active', label: 'Active' },
  { id: 'paused', label: 'Paused' },
  { id: 'past', label: 'Past' },
];
const INVOICE_STATUS = [
  { id: 'draft', label: 'Draft' },
  { id: 'sent', label: 'Sent' },
  { id: 'paid', label: 'Paid' },
  { id: 'void', label: 'Cancelled' },
];
const EXPENSE_CATS = [
  { id: 'ads', label: 'Ad spend' },
  { id: 'software', label: 'Software' },
  { id: 'freelancer', label: 'Freelancers' },
  { id: 'production', label: 'Production' },
  { id: 'travel', label: 'Travel and meals' },
  { id: 'admin', label: 'Admin and fees' },
  { id: 'other', label: 'Other' },
];

function makeClient(fields) {
  return Object.assign({ id: newId('c'), name: '', contact: '', email: '', phone: '', status: 'active', notes: '', color: 0, createdAt: new Date().toISOString() }, fields || {});
}
function makeInvoice(fields) {
  return Object.assign({ id: newId('i'), number: '', clientId: '', title: '', issueDate: '', dueDate: '', status: 'draft', items: [], notes: '', paidOn: '', createdAt: new Date().toISOString() }, fields || {});
}
function makeExpense(fields) {
  return Object.assign({ id: newId('x'), date: '', category: 'other', vendor: '', amount: 0, clientId: '', note: '', createdAt: new Date().toISOString() }, fields || {});
}
function makeNote(fields) {
  const now = new Date().toISOString();
  return Object.assign({ id: newId('n'), title: '', body: '', clientId: '', pinned: false, createdAt: now, updatedAt: now }, fields || {});
}

/** Round money to 2 decimal places. */
function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}

function emptyState() {
  return { version: 1, people: [], groups: [], tasks: [], events: [], lapses: [], clients: [], invoices: [], expenses: [], notes: [], ads: [], sales: [], settings: defaultSettings() };
}

function defaultSettings() {
  return {
    workspaceName: 'Task Tracker',
    reminderHour: 7,
    reminderOn: true,
    reminderDueSoonDays: 3,
    weekendReminders: true,
    meId: '',
    currency: '$',
    invoicePrefix: 'INV-',
    invoiceTermsDays: 14,
    payNote: '',
    mailApp: 'gmail',
  };
}

function makeTask(fields) {
  const now = new Date().toISOString();
  return Object.assign(
    {
      id: newId('t'),
      groupId: '',
      title: '',
      status: 'not_started',
      ownerId: '',
      alsoIds: [], // other people who share the task
      itemId: '', // number shown to the user, for example 1042
      clientId: '',
      due: '',
      followUp: '',
      priority: 'medium',
      remarks: '',
      subtasks: [],
      recur: null, // { freq, interval, anchorDay } or null
      seriesId: '',
      createdAt: now,
      updatedAt: now,
      completedAt: '',
      completedOn: '', // local date of completion, YYYY-MM-DD
      stuckSince: '', // local date the task went to Stuck
      history: [], // [{ at, by, what }] newest last
      order: 0,
    },
    fields || {}
  );
}

function makeEvent(fields) {
  return Object.assign(
    { id: newId('e'), title: '', date: '', start: '', end: '', type: 'meeting', notes: '', ownerId: '', updatedAt: new Date().toISOString() },
    fields || {}
  );
}

// ---------- People on a task ----------

/** Every person on a task: the owner first, then the people who share it. */
function taskPeople(t) {
  const out = [];
  if (t.ownerId) out.push(t.ownerId);
  (t.alsoIds || []).forEach((id) => {
    if (id && out.indexOf(id) === -1) out.push(id);
  });
  return out;
}

/** True when the person is the owner of the task or shares it. */
function isAssigned(t, personId) {
  return t.ownerId === personId || (t.alsoIds || []).indexOf(personId) !== -1;
}

/** The next free item ID: 1 above the largest number in use (Monday item IDs stay as they are). */
function nextItemId(state) {
  let max = 1000;
  state.tasks.forEach((t) => {
    const n = /^\d+$/.test(t.itemId || '') ? Number(t.itemId) : 0;
    if (n > max) max = n;
  });
  return String(max + 1);
}

// ---------- Ads and sales records ----------

const AD_PLATFORMS = [
  { id: 'meta', label: 'Meta (Facebook, Instagram)' },
  { id: 'google', label: 'Google' },
  { id: 'tiktok', label: 'TikTok' },
  { id: 'other', label: 'Other' },
];

function makeAdEntry(fields) {
  return Object.assign({ id: newId('a'), date: '', campaign: '', platform: 'meta', clientId: '', ownerId: '', spend: 0, leads: 0, clicks: 0, sales: 0, note: '', createdAt: new Date().toISOString() }, fields || {});
}

/** One sales tally: one record for each person for each day. */
function salesDayId(date, ownerId) {
  return 'sd_' + date + '_' + (ownerId || 'none');
}
function makeSalesDay(fields) {
  const f = fields || {};
  return Object.assign({ id: salesDayId(f.date || '', f.ownerId || ''), date: '', ownerId: '', leads: 0, contacted: 0, booked: 0, closed: 0, value: 0, note: '' }, f);
}

// ---------- Derived facts ----------

function isOpen(t) {
  return t.status !== 'done';
}

function isOverdue(t, today) {
  return isOpen(t) && !!t.due && t.due < today;
}

function daysLate(t, today) {
  if (!t.due) return 0;
  const end = t.status === 'done' ? t.completedOn || today : today;
  const n = diffDays(t.due, end);
  return n > 0 ? n : 0;
}

/** True when a completed task was completed after its due date. */
function wasLate(t) {
  return t.status === 'done' && !!t.due && !!t.completedOn && t.completedOn > t.due;
}

function subtaskProgress(t) {
  const total = (t.subtasks || []).length;
  const done = (t.subtasks || []).filter((s) => s.done).length;
  return { total, done };
}

function followUpDue(t, today) {
  return isOpen(t) && !!t.followUp && t.followUp <= today;
}

// ---------- Recurring tasks ----------

function recurLabel(recur) {
  if (!recur || !recur.freq) return '';
  const f = RECUR_FREQ.find((x) => x.id === recur.freq);
  if (!f) return '';
  const n = recur.interval || 1;
  return n === 1 ? f.label : 'Every ' + n + ' ' + f.unit + 's';
}

/** The next due date after `due` for a recurrence rule. */
function nextDue(due, recur) {
  if (!recur || !recur.freq || !isDateStr(due)) return '';
  const n = Math.max(1, recur.interval || 1);
  const anchor = recur.anchorDay || parts(due).d;
  if (recur.freq === 'daily') return addDays(due, n);
  if (recur.freq === 'weekly') return addDays(due, 7 * n);
  if (recur.freq === 'monthly') return addMonths(due, n, anchor);
  if (recur.freq === 'yearly') return addMonths(due, 12 * n, anchor);
  return '';
}

/** Future dates of a recurring task, for the calendar preview. Dates are > task.due and <= until. */
function projectOccurrences(task, until, max) {
  const out = [];
  if (!task.recur || !task.due) return out;
  let d = task.due;
  const cap = max || 60;
  while (out.length < cap) {
    d = nextDue(d, task.recur);
    if (!d || d > until) break;
    out.push(d);
  }
  return out;
}

/** Build the next task of a series from a completed one. Subtasks are copied and reset. */
function spawnNext(task, today) {
  if (!task.recur || !task.due) return null;
  let due = nextDue(task.due, task.recur);
  if (!due) return null;
  // If the task was completed very late, do not create a chain of tasks that are already overdue.
  // Skip forward to the first date that is not before today.
  let guard = 0;
  while (today && due < today && guard < 400) {
    const nd = nextDue(due, task.recur);
    if (!nd || nd === due) break;
    due = nd;
    guard++;
  }
  const gap = task.followUp && task.due ? diffDays(task.due, task.followUp) : null;
  return makeTask({
    groupId: task.groupId,
    title: task.title,
    ownerId: task.ownerId,
    alsoIds: (task.alsoIds || []).slice(),
    clientId: task.clientId || '',
    priority: task.priority,
    remarks: '',
    due,
    followUp: gap === null ? '' : addDays(due, gap),
    recur: Object.assign({}, task.recur),
    seriesId: task.seriesId || task.id,
    subtasks: (task.subtasks || []).map((s) => ({ id: newId('s'), title: s.title, done: false })),
    order: task.order,
    history: [{ at: new Date().toISOString(), by: '', what: 'Created by the repeat rule' }],
  });
}

// ---------- State changes ----------
// Each function returns a NEW state. The old state is not changed.

function replaceTask(state, task) {
  return Object.assign({}, state, { tasks: state.tasks.map((t) => (t.id === task.id ? task : t)) });
}

function stamp(task) {
  task.updatedAt = new Date().toISOString();
  return task;
}

function getTask(state, id) {
  return state.tasks.find((t) => t.id === id) || null;
}

function addTask(state, fields) {
  const inGroup = state.tasks.filter((t) => t.groupId === fields.groupId);
  const order = inGroup.reduce((m, t) => Math.max(m, t.order || 0), 0) + 1;
  const task = makeTask(Object.assign({ order }, fields));
  if (!task.itemId) task.itemId = nextItemId(state);
  if (!task.history.length) task.history = withHistory(task, 'Task created');
  if (task.recur && !task.seriesId) task.seriesId = task.id;
  if (task.recur && task.due && !task.recur.anchorDay) task.recur = Object.assign({}, task.recur, { anchorDay: parts(task.due).d });
  return { state: Object.assign({}, state, { tasks: state.tasks.concat([task]) }), task };
}

function updateTask(state, id, patch) {
  const old = getTask(state, id);
  if (!old) return state;
  const task = stamp(Object.assign({}, old, patch));
  if (patch.due !== undefined && patch.due !== old.due) {
    task.history = withHistory(task, !old.due ? 'Due date set: ' + patch.due : !patch.due ? 'Due date removed (was ' + old.due + ')' : 'Due date moved: ' + old.due + ' to ' + patch.due);
  }
  if (patch.ownerId !== undefined && patch.ownerId !== old.ownerId) task.history = withHistory(task, 'Owner changed');
  if (task.recur && task.due) {
    const dueChanged = patch.due !== undefined && patch.due !== old.due;
    if (dueChanged || !task.recur.anchorDay) task.recur = Object.assign({}, task.recur, { anchorDay: parts(task.due).d });
    if (!task.seriesId) task.seriesId = task.id;
  }
  return replaceTask(state, task);
}

function deleteTask(state, id) {
  return Object.assign({}, state, {
    tasks: state.tasks.filter((t) => t.id !== id),
    lapses: state.lapses.filter((l) => l.taskId !== id),
  });
}

/**
 * Change the status of a task.
 * Returns { state, spawned, ask }.
 *   spawned: the next task of a recurring series, or null.
 *   ask: 'late' when the task was completed after its due date, 'stuck' when it moved to Stuck, else ''.
 *        The app uses `ask` to open the "what went wrong?" question.
 */
function setStatus(state, id, status, today) {
  const old = getTask(state, id);
  if (!old || old.status === status) return { state, spawned: null, ask: '' };
  const task = stamp(Object.assign({}, old, { status }));
  task.history = withHistory(task, 'Status: ' + STATUS[old.status].label + ' to ' + STATUS[status].label);
  let spawned = null;
  let ask = '';

  if (status === 'done') {
    task.completedAt = new Date().toISOString();
    task.completedOn = today;
    task.stuckSince = '';
    if (task.due && today > task.due) ask = 'late';
    if (task.recur && task.due) {
      const exists = state.tasks.some((t) => t.id !== task.id && (t.seriesId || t.id) === (task.seriesId || task.id) && t.status !== 'done' && t.due > task.due);
      if (!exists) spawned = spawnNext(task, today);
    }
  } else {
    task.completedAt = '';
    task.completedOn = '';
    if (status === 'stuck') {
      task.stuckSince = today;
      ask = 'stuck';
    } else {
      task.stuckSince = '';
    }
  }

  let next = replaceTask(state, task);
  if (spawned) {
    spawned.itemId = nextItemId(state);
    next = Object.assign({}, next, { tasks: next.tasks.concat([spawned]) });
  }
  return { state: next, spawned, ask };
}

/** Record why a task was late or stuck. */
function addLapse(state, taskId, kind, reason, note, today) {
  const task = getTask(state, taskId);
  const lapse = {
    id: newId('l'),
    taskId,
    taskTitle: task ? task.title : '',
    ownerId: task ? task.ownerId : '',
    groupId: task ? task.groupId : '',
    kind, // 'late' or 'stuck'
    reason,
    note: note || '',
    date: today,
    daysLate: task && kind === 'late' ? daysLate(task, today) : 0,
  };
  return Object.assign({}, state, { lapses: state.lapses.concat([lapse]) });
}

function setSubtasks(state, id, subtasks) {
  return updateTask(state, id, { subtasks });
}

function addEvent(state, fields) {
  const ev = makeEvent(fields);
  return { state: Object.assign({}, state, { events: state.events.concat([ev]) }), event: ev };
}
function updateEvent(state, id, patch) {
  return Object.assign({}, state, {
    events: state.events.map((e) => (e.id === id ? Object.assign({}, e, patch, { updatedAt: new Date().toISOString() }) : e)),
  });
}
function deleteEvent(state, id) {
  return Object.assign({}, state, { events: state.events.filter((e) => e.id !== id) });
}

function personName(state, id) {
  const p = state.people.find((x) => x.id === id);
  return p ? p.name : 'Unassigned';
}
function groupName(state, id) {
  const g = state.groups.find((x) => x.id === id);
  return g ? g.name : 'No group';
}

/** True on Saturday or Sunday. */
function isWeekend(s) {
  const d = dow(s);
  return d === 0 || d === 6;
}

/** A profile photo must be a small image stored in the data itself. Anything else is dropped. */
function cleanPhoto(v) {
  return typeof v === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v) && v.length <= 40000 ? v : '';
}

/** Check and repair a state object that came from storage or an import. Never throws. */
function sanitizeState(raw) {
  const base = emptyState();
  if (!raw || typeof raw !== 'object') return base;
  const arr = (v) => (Array.isArray(v) ? v : []);
  const str = (v) => (typeof v === 'string' ? v : v === null || v === undefined ? '' : String(v));
  const date = (v) => (isDateStr(v) ? v : '');
  const count = (v) => Math.max(0, Math.round(Number(v) || 0));
  const state = {
    version: 1,
    people: arr(raw.people)
      .filter((p) => p && p.id)
      .map((p) => ({ id: str(p.id), name: str(p.name) || 'Person', email: str(p.email), color: Number(p.color) || 0, photo: cleanPhoto(p.photo) })),
    groups: arr(raw.groups)
      .filter((g) => g && g.id)
      .map((g, i) => ({ id: str(g.id), name: str(g.name) || 'Group', color: Number(g.color) || 0, order: Number(g.order) || i, collapsed: !!g.collapsed })),
    tasks: [],
    events: arr(raw.events)
      .filter((e) => e && e.id && isDateStr(e.date))
      .map((e) => ({
        id: str(e.id),
        title: str(e.title) || 'Event',
        date: e.date,
        start: /^\d{2}:\d{2}$/.test(str(e.start)) ? e.start : '',
        end: /^\d{2}:\d{2}$/.test(str(e.end)) ? e.end : '',
        type: EVENT_TYPES.some((t) => t.id === e.type) ? e.type : 'event',
        notes: str(e.notes),
        ownerId: str(e.ownerId),
        updatedAt: str(e.updatedAt),
      })),
    lapses: arr(raw.lapses)
      .filter((l) => l && l.id)
      .map((l) => ({
        id: str(l.id),
        taskId: str(l.taskId),
        taskTitle: str(l.taskTitle),
        ownerId: str(l.ownerId),
        groupId: str(l.groupId),
        kind: l.kind === 'stuck' ? 'stuck' : 'late',
        reason: LAPSE_REASONS.some((r) => r.id === l.reason) ? l.reason : 'other',
        note: str(l.note),
        date: date(l.date),
        daysLate: Number(l.daysLate) || 0,
      })),
    clients: arr(raw.clients)
      .filter((c) => c && c.id)
      .map((c) => ({ id: str(c.id), name: str(c.name) || 'Client', contact: str(c.contact), email: str(c.email), phone: str(c.phone), status: CLIENT_STATUS.some((x) => x.id === c.status) ? c.status : 'active', notes: str(c.notes), color: Number(c.color) || 0, createdAt: str(c.createdAt) })),
    invoices: arr(raw.invoices)
      .filter((v) => v && v.id)
      .map((v) => ({
        id: str(v.id),
        number: str(v.number),
        clientId: str(v.clientId),
        title: str(v.title),
        issueDate: date(v.issueDate),
        dueDate: date(v.dueDate),
        status: INVOICE_STATUS.some((x) => x.id === v.status) ? v.status : 'draft',
        items: arr(v.items)
          .filter((it) => it && typeof it === 'object')
          .map((it) => ({ desc: str(it.desc), qty: Number(it.qty) || 0, rate: round2(it.rate) })),
        notes: str(v.notes),
        paidOn: date(v.paidOn),
        createdAt: str(v.createdAt),
      })),
    expenses: arr(raw.expenses)
      .filter((x) => x && x.id)
      .map((x) => ({ id: str(x.id), date: date(x.date), category: EXPENSE_CATS.some((c) => c.id === x.category) ? x.category : 'other', vendor: str(x.vendor), amount: round2(x.amount), clientId: str(x.clientId), note: str(x.note), createdAt: str(x.createdAt) })),
    notes: arr(raw.notes)
      .filter((n) => n && n.id)
      .map((n) => ({ id: str(n.id), title: str(n.title), body: str(n.body), clientId: str(n.clientId), pinned: n.pinned === true || n.pinned === 'true', createdAt: str(n.createdAt), updatedAt: str(n.updatedAt) })),
    ads: arr(raw.ads)
      .filter((a) => a && a.id && isDateStr(a.date))
      .map((a) => ({ id: str(a.id), date: a.date, campaign: str(a.campaign), platform: AD_PLATFORMS.some((x) => x.id === a.platform) ? a.platform : 'other', clientId: str(a.clientId), ownerId: str(a.ownerId), spend: Math.max(0, round2(a.spend)), leads: count(a.leads), clicks: count(a.clicks), sales: count(a.sales), note: str(a.note), createdAt: str(a.createdAt) })),
    sales: arr(raw.sales)
      .filter((d) => d && d.id && isDateStr(d.date))
      .map((d) => ({ id: str(d.id), date: d.date, ownerId: str(d.ownerId), leads: count(d.leads), contacted: count(d.contacted), booked: count(d.booked), closed: count(d.closed), value: Math.max(0, round2(d.value)), note: str(d.note) })),
    settings: Object.assign(defaultSettings(), raw.settings && typeof raw.settings === 'object' ? raw.settings : {}),
  };
  state.tasks = arr(raw.tasks)
    .filter((t) => t && t.id)
    .map((t, i) => {
      const recur = t.recur && RECUR_FREQ.some((f) => f.id === t.recur.freq)
        ? { freq: t.recur.freq, interval: Math.max(1, Number(t.recur.interval) || 1), anchorDay: Number(t.recur.anchorDay) || 0 }
        : null;
      return {
        id: str(t.id),
        groupId: str(t.groupId),
        title: str(t.title),
        status: STATUS[t.status] ? t.status : 'not_started',
        ownerId: str(t.ownerId),
        alsoIds: arr(t.alsoIds).map(str).filter((x) => x && x !== str(t.ownerId)),
        itemId: str(t.itemId).slice(0, 24),
        clientId: str(t.clientId),
        due: date(t.due),
        followUp: date(t.followUp),
        priority: PRIORITY[t.priority] ? t.priority : 'medium',
        remarks: str(t.remarks),
        subtasks: arr(t.subtasks)
          .filter((s) => s && s.id)
          .map((s) => ({ id: str(s.id), title: str(s.title), done: !!s.done })),
        recur,
        seriesId: str(t.seriesId),
        createdAt: str(t.createdAt),
        updatedAt: str(t.updatedAt),
        completedAt: str(t.completedAt),
        completedOn: date(t.completedOn),
        stuckSince: date(t.stuckSince),
        history: arr(t.history)
          .filter((x) => x && x.at && x.what)
          .slice(-HISTORY_MAX)
          .map((x) => ({ at: str(x.at), by: str(x.by), what: str(x.what) })),
        order: Number(t.order) || i,
      };
    });
  return state;
}

// ---- core/analytics.js ----
// Numbers for the dashboard. Pure functions only.




function createdOn(t) {
  return (t.createdAt || '').slice(0, 10);
}

/** Keep only the tasks that match the dashboard filter { ownerId, groupId }. */
function filterTasks(tasks, filter) {
  const f = filter || {};
  return tasks.filter((t) => (!f.ownerId || isAssigned(t, f.ownerId)) && (!f.groupId || t.groupId === f.groupId));
}

function kpis(state, today, filter, windowDays) {
  const win = windowDays || 30;
  const tasks = filterTasks(state.tasks, filter);
  const from = addDays(today, -(win - 1));
  const prevFrom = addDays(from, -win);
  const open = tasks.filter(isOpen);
  const overdue = open.filter((t) => isOverdue(t, today));
  const stuck = open.filter((t) => t.status === 'stuck');
  const dueToday = open.filter((t) => t.due === today);
  const weekEnd = addDays(today, 6);
  const dueWeek = open.filter((t) => t.due && t.due >= today && t.due <= weekEnd);

  const doneIn = (a, b) => tasks.filter((t) => t.status === 'done' && t.completedOn && t.completedOn >= a && t.completedOn <= b);
  const doneNow = doneIn(from, today);
  const donePrev = doneIn(prevFrom, addDays(from, -1));
  const rate = (list) => {
    const dated = list.filter((t) => t.due);
    if (!dated.length) return null;
    return Math.round((dated.filter((t) => !wasLate(t)).length / dated.length) * 100);
  };
  const lateNow = doneNow.filter(wasLate);
  const avgLate = lateNow.length ? Math.round((lateNow.reduce((s, t) => s + daysLate(t, today), 0) / lateNow.length) * 10) / 10 : 0;
  const timed = doneNow.filter((t) => createdOn(t) && t.completedOn >= createdOn(t));
  const avgCycle = timed.length ? Math.round((timed.reduce((s, t) => s + diffDays(createdOn(t), t.completedOn), 0) / timed.length) * 10) / 10 : null;

  return {
    windowDays: win,
    open: open.length,
    overdue: overdue.length,
    stuck: stuck.length,
    dueToday: dueToday.length,
    dueWeek: dueWeek.length,
    done: doneNow.length,
    donePrev: donePrev.length,
    onTime: rate(doneNow),
    onTimePrev: rate(donePrev),
    lateDone: lateNow.length,
    avgDaysLate: avgLate,
    avgCycleDays: avgCycle,
    followUps: open.filter((t) => followUpDue(t, today)).length,
  };
}

/** Per-day counts of tasks created and tasks completed, for the line chart. */
function flowSeries(state, today, days, filter) {
  const tasks = filterTasks(state.tasks, filter);
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(today, -i);
    out.push({ date: d, created: 0, completed: 0 });
  }
  const index = {};
  out.forEach((p, i) => (index[p.date] = i));
  tasks.forEach((t) => {
    const c = createdOn(t);
    if (index[c] !== undefined) out[index[c]].created++;
    if (t.status === 'done' && index[t.completedOn] !== undefined) out[index[t.completedOn]].completed++;
  });
  return out;
}

/** Open tasks at the end of each day (the backlog), for the trend line. */
function backlogSeries(state, today, days, filter) {
  const tasks = filterTasks(state.tasks, filter);
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(today, -i);
    let open = 0;
    let overdue = 0;
    tasks.forEach((t) => {
      const c = createdOn(t);
      if (!c || c > d) return;
      const doneBy = t.status === 'done' && t.completedOn && t.completedOn <= d;
      if (doneBy) return;
      open++;
      if (t.due && t.due < d) overdue++;
    });
    out.push({ date: d, open, overdue });
  }
  return out;
}

/** Count per status. Completed tasks count only when they were completed inside the window. */
function statusBreakdown(state, today, filter, windowDays) {
  const tasks = filterTasks(state.tasks, filter);
  const from = addDays(today, -((windowDays || 30) - 1));
  const counts = {};
  STATUS_ORDER.forEach((s) => (counts[s] = 0));
  tasks.forEach((t) => {
    if (t.status === 'done') {
      if (t.completedOn && t.completedOn >= from) counts.done++;
    } else counts[t.status]++;
  });
  return STATUS_ORDER.map((s) => ({ status: s, count: counts[s] }));
}

/** Open tasks for each person, split into on track, stuck and overdue. */
function workload(state, today, filter) {
  const tasks = filterTasks(state.tasks, filter).filter(isOpen);
  const rows = state.people.map((p) => ({ id: p.id, name: p.name, onTrack: 0, stuck: 0, overdue: 0, total: 0 }));
  const none = { id: '', name: 'Unassigned', onTrack: 0, stuck: 0, overdue: 0, total: 0 };
  const add = (row, t) => {
    row.total++;
    if (isOverdue(t, today)) row.overdue++;
    else if (t.status === 'stuck') row.stuck++;
    else row.onTrack++;
  };
  tasks.forEach((t) => {
    // A shared task counts for each person on it.
    const mine = rows.filter((r) => isAssigned(t, r.id));
    if (mine.length) mine.forEach((r) => add(r, t));
    else add(none, t);
  });
  if (none.total) rows.push(none);
  return rows;
}

/** Count of lapse records for each reason, most frequent first. */
function lapseSummary(state, today, filter, windowDays) {
  const f = filter || {};
  const from = addDays(today, -((windowDays || 90) - 1));
  const list = state.lapses.filter((l) => (!l.date || l.date >= from) && (!f.ownerId || l.ownerId === f.ownerId) && (!f.groupId || l.groupId === f.groupId));
  const rows = LAPSE_REASONS.map((r) => ({ reason: r.id, label: r.label, late: 0, stuck: 0, total: 0 }));
  list.forEach((l) => {
    const row = rows.find((r) => r.reason === l.reason) || rows[rows.length - 1];
    row[l.kind === 'stuck' ? 'stuck' : 'late']++;
    row.total++;
  });
  return { rows: rows.filter((r) => r.total > 0).sort((a, b) => b.total - a.total), total: list.length, list: list.slice().sort((a, b) => (a.date < b.date ? 1 : -1)) };
}

/** The tasks that need action now: overdue, stuck, and follow-ups that are due. One row for each task. */
function attentionList(state, today, filter) {
  const tasks = filterTasks(state.tasks, filter).filter(isOpen);
  const rows = [];
  tasks.forEach((t) => {
    const overdue = isOverdue(t, today);
    const stuck = t.status === 'stuck';
    const follow = followUpDue(t, today);
    if (!overdue && !stuck && !follow) return;
    const late = overdue ? diffDays(t.due, today) : 0;
    const stuckDays = stuck && t.stuckSince ? Math.max(0, diffDays(t.stuckSince, today)) : 0;
    const why = [];
    if (overdue) why.push(late + (late === 1 ? ' day late' : ' days late'));
    if (stuck) why.push(stuckDays > 0 ? 'Stuck ' + stuckDays + (stuckDays === 1 ? ' day' : ' days') : 'Stuck since today');
    if (follow) why.push('Follow-up due');
    rows.push({ task: t, overdue, stuck, follow, late, stuckDays, why: why.join(' · '), score: late * 2 + stuckDays + (follow ? 1 : 0) + (t.priority === 'high' ? 3 : 0) });
  });
  return rows.sort((a, b) => b.score - a.score);
}

/** Open tasks that are due in the next `days` days (today included), soonest first. */
function upcoming(state, today, days, filter) {
  const end = addDays(today, days - 1);
  return filterTasks(state.tasks, filter)
    .filter((t) => isOpen(t) && t.due && t.due >= today && t.due <= end)
    .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
}

/** On-time rate for each of the last `weeks` weeks (Monday start). */
function weeklyOnTime(state, today, weeks, filter) {
  const tasks = filterTasks(state.tasks, filter).filter((t) => t.status === 'done' && t.due && t.completedOn);
  const thisWeek = startOfWeek(today);
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const start = addDays(thisWeek, -7 * i);
    const end = addDays(start, 6);
    const list = tasks.filter((t) => t.completedOn >= start && t.completedOn <= end);
    const late = list.filter(wasLate).length;
    out.push({ start, label: fmtShort(start), done: list.length, late, onTime: list.length - late, rate: list.length ? Math.round(((list.length - late) / list.length) * 100) : null });
  }
  return out;
}

/**
 * Plain-language findings: "where do I fall short?".
 * Each finding is { tone: 'bad' | 'warn' | 'good' | 'info', title, detail }.
 */
function insights(state, today, filter) {
  const out = [];
  const k = kpis(state, today, filter, 30);
  const tasks = filterTasks(state.tasks, filter);
  const groupOf = (id) => {
    const g = state.groups.find((x) => x.id === id);
    return g ? g.name : 'No group';
  };

  if (k.onTime !== null) {
    const diff = k.onTimePrev === null ? null : k.onTime - k.onTimePrev;
    const trend = diff === null ? '' : diff === 0 ? ' This is the same as the 30 days before.' : ' This is ' + Math.abs(diff) + ' points ' + (diff > 0 ? 'better' : 'worse') + ' than the 30 days before.';
    out.push({
      tone: k.onTime >= 85 ? 'good' : k.onTime >= 65 ? 'warn' : 'bad',
      title: k.onTime + '% of tasks were completed on time',
      detail: k.lateDone + ' of ' + (k.done || 0) + ' completed tasks were late in the last 30 days' + (k.lateDone ? ', by ' + k.avgDaysLate + ' days on average.' : '.') + trend,
    });
  }

  const ls = lapseSummary(state, today, filter, 90);
  if (ls.total >= 2 && ls.rows.length) {
    const top = ls.rows[0];
    const share = Math.round((top.total / ls.total) * 100);
    out.push({
      tone: 'warn',
      title: 'Main cause of delay: ' + top.label.toLowerCase(),
      detail: top.total + ' of ' + ls.total + ' recorded lapses (' + share + '%) in the last 90 days have this reason.',
    });
  }

  // Group with the most overdue and stuck work.
  const byGroup = {};
  tasks.filter(isOpen).forEach((t) => {
    if (isOverdue(t, today) || t.status === 'stuck') byGroup[t.groupId] = (byGroup[t.groupId] || 0) + 1;
  });
  const worst = Object.keys(byGroup).sort((a, b) => byGroup[b] - byGroup[a])[0];
  if (worst !== undefined && byGroup[worst] >= 2) {
    out.push({ tone: 'bad', title: '"' + groupOf(worst) + '" has the most blocked work', detail: byGroup[worst] + ' tasks in this group are overdue or stuck now.' });
  }

  // Oldest stuck task.
  const stuck = tasks.filter((t) => t.status === 'stuck' && t.stuckSince).sort((a, b) => (a.stuckSince < b.stuckSince ? -1 : 1))[0];
  if (stuck) {
    const n = diffDays(stuck.stuckSince, today);
    if (n >= 3) out.push({ tone: 'bad', title: 'Stuck the longest: ' + stuck.title, detail: 'This task has been stuck for ' + n + ' days. Decide on the next action or change the plan.' });
  }

  // Weekday on which late completions had their due date.
  const lateDone = tasks.filter((t) => wasLate(t) && t.completedOn >= addDays(today, -89));
  if (lateDone.length >= 4) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    lateDone.forEach((t) => counts[dow(t.due)]++);
    const max = Math.max.apply(null, counts);
    const day = counts.indexOf(max);
    if (max >= 3 && max / lateDone.length >= 0.4) {
      out.push({ tone: 'info', title: 'Deadlines on ' + DOWS[day] + ' slip the most', detail: max + ' of ' + lateDone.length + ' late tasks had a due date on ' + DOWS[day] + '. Give these tasks an earlier start.' });
    }
  }

  // Tasks whose due date was moved again and again.
  const moved = tasks.filter((t) => isOpen(t) && dueMoves(t) >= 2).sort((a, b) => dueMoves(b) - dueMoves(a));
  if (moved.length) out.push({ tone: 'warn', title: 'Due date moved ' + dueMoves(moved[0]) + ' times: ' + moved[0].title, detail: moved.length === 1 ? 'A date that moves again and again shows a task that is too big or not important. Split it or drop it.' : moved.length + ' open tasks had the due date moved 2 times or more. Split these tasks or drop them.' });

  // Tasks with no due date.
  const noDue = tasks.filter((t) => isOpen(t) && !t.due).length;
  if (noDue >= 3) out.push({ tone: 'info', title: noDue + ' open tasks have no due date', detail: 'Tasks without a date do not show in the calendar or in reminders.' });

  if (k.overdue === 0 && k.stuck === 0 && k.open > 0) out.push({ tone: 'good', title: 'Nothing is overdue or stuck', detail: 'All ' + k.open + ' open tasks are on track.' });

  return out;
}

// ---- core/digest.js ----
// The morning reminder. Builds one digest for each person: overdue, due today, stuck, follow-ups, due soon.
// Pure functions only. The backend sends the result by email. The app shows the same result as a preview.




function byDue(a, b) {
  return (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0;
}

/**
 * Sections of the digest for one person.
 * Tasks with no owner go to every person, so that no task is lost.
 */
function digestFor(state, personId, today) {
  const soonDays = Math.max(1, Number(state.settings.reminderDueSoonDays) || 3);
  const mine = state.tasks.filter((t) => isOpen(t) && (isAssigned(t, personId) || !t.ownerId));
  const overdue = mine.filter((t) => isOverdue(t, today)).sort(byDue);
  const dueToday = mine.filter((t) => t.due === today);
  const stuck = mine.filter((t) => t.status === 'stuck' && !isOverdue(t, today) && t.due !== today);
  const used = {};
  overdue.concat(dueToday, stuck).forEach((t) => (used[t.id] = true));
  const followUps = mine.filter((t) => followUpDue(t, today) && !used[t.id]);
  followUps.forEach((t) => (used[t.id] = true));
  const soonEnd = addDays(today, soonDays);
  const dueSoon = mine.filter((t) => t.due && t.due > today && t.due <= soonEnd && !used[t.id]).sort(byDue);
  const events = state.events
    .filter((e) => e.date === today && (!e.ownerId || e.ownerId === personId))
    .sort((a, b) => ((a.start || '') < (b.start || '') ? -1 : 1));
  const count = overdue.length + dueToday.length + stuck.length + followUps.length + dueSoon.length;
  return { personId, today, soonDays, overdue, dueToday, stuck, followUps, dueSoon, events, count, isEmpty: count === 0 && events.length === 0 };
}

function line(t, today, state) {
  const g = state.groups.find((x) => x.id === t.groupId);
  let when = '';
  if (t.due) {
    const n = diffDays(today, t.due);
    when = n < 0 ? -n + (n === -1 ? ' day late' : ' days late') + ' (due ' + fmtShort(t.due) + ')' : n === 0 ? 'due today' : 'due ' + fmtShort(t.due);
  } else when = 'no due date';
  const extra = [];
  if (t.status === 'stuck') extra.push('STUCK');
  if (t.followUp && t.followUp <= today) extra.push('follow up');
  const sub = (t.subtasks || []).length ? ' [' + t.subtasks.filter((s) => s.done).length + '/' + t.subtasks.length + ' subtasks]' : '';
  return { title: t.title, group: g ? g.name : '', when, flags: extra.join(', '), sub, remarks: t.remarks || '' };
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/**
 * Build the email for one person.
 * Returns null when there is nothing to send (reminders off, weekend rule, or an empty digest).
 */
function buildDigestEmail(state, person, today, appUrl) {
  const s = state.settings || {};
  if (s.reminderOn === false) return null;
  if (s.weekendReminders === false && isWeekend(today)) return null;
  const d = digestFor(state, person.id, today);
  if (d.isEmpty) return null;

  const sections = [
    { key: 'overdue', title: 'Overdue', color: '#c62828', items: d.overdue },
    { key: 'dueToday', title: 'Due today', color: '#b26a00', items: d.dueToday },
    { key: 'stuck', title: 'Stuck', color: '#c62828', items: d.stuck },
    { key: 'followUps', title: 'Follow up today', color: '#1565c0', items: d.followUps },
    { key: 'dueSoon', title: 'Due in the next ' + d.soonDays + ' days', color: '#455a64', items: d.dueSoon },
  ].filter((x) => x.items.length);

  const bits = [];
  if (d.overdue.length) bits.push(d.overdue.length + ' overdue');
  if (d.dueToday.length) bits.push(d.dueToday.length + ' due today');
  if (d.stuck.length) bits.push(d.stuck.length + ' stuck');
  if (!bits.length && d.followUps.length) bits.push(d.followUps.length + ' to follow up');
  if (!bits.length && d.dueSoon.length) bits.push(d.dueSoon.length + ' due soon');
  if (!bits.length && d.events.length) bits.push(d.events.length + (d.events.length === 1 ? ' event today' : ' events today'));
  const subject = (s.workspaceName || 'Task Tracker') + ': ' + bits.join(', ') + ' (' + fmtShort(today) + ')';

  // Plain text
  const text = [];
  text.push('Good morning ' + person.name + '.');
  text.push('Your tasks for ' + fmtLong(today) + ':');
  text.push('');
  if (d.events.length) {
    text.push('TODAY IN THE CALENDAR');
    d.events.forEach((e) => text.push('  - ' + (e.start ? e.start + ' ' : '') + e.title));
    text.push('');
  }
  sections.forEach((sec) => {
    text.push(sec.title.toUpperCase() + ' (' + sec.items.length + ')');
    sec.items.forEach((t) => {
      const l = line(t, today, state);
      text.push('  - ' + l.title + ' - ' + l.when + (l.flags ? ' - ' + l.flags : '') + l.sub + (l.group ? ' - ' + l.group : ''));
    });
    text.push('');
  });
  if (appUrl) text.push('Open the tracker: ' + appUrl);

  // HTML (inline styles only; email programs remove style sheets)
  const h = [];
  h.push('<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:600px;margin:0 auto;color:#1c1f24;font-size:14px;line-height:1.45">');
  h.push('<p style="margin:0 0 4px;font-size:16px;font-weight:600">Good morning ' + esc(person.name) + '.</p>');
  h.push('<p style="margin:0 0 16px;color:#5b6470">Your tasks for ' + esc(fmtLong(today)) + '.</p>');
  if (d.events.length) {
    h.push('<p style="margin:16px 0 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#455a64">Today in the calendar</p>');
    h.push('<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">');
    d.events.forEach((e) => {
      h.push('<tr><td style="padding:6px 0;border-bottom:1px solid #e6e8eb;width:64px;color:#5b6470">' + esc(e.start || 'All day') + '</td><td style="padding:6px 0;border-bottom:1px solid #e6e8eb">' + esc(e.title) + '</td></tr>');
    });
    h.push('</table>');
  }
  sections.forEach((sec) => {
    h.push('<p style="margin:18px 0 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:' + sec.color + '">' + esc(sec.title) + ' (' + sec.items.length + ')</p>');
    h.push('<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">');
    sec.items.forEach((t) => {
      const l = line(t, today, state);
      h.push(
        '<tr><td style="padding:7px 0;border-bottom:1px solid #e6e8eb"><span style="font-weight:600">' +
          esc(l.title) +
          '</span>' +
          (l.flags ? ' <span style="color:#c62828;font-size:12px">' + esc(l.flags) + '</span>' : '') +
          '<br><span style="color:#5b6470;font-size:13px">' +
          esc(l.when + l.sub + (l.group ? ' · ' + l.group : '')) +
          '</span></td></tr>'
      );
    });
    h.push('</table>');
  });
  if (appUrl) h.push('<p style="margin:22px 0 0"><a href="' + esc(appUrl) + '" style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:9px 16px;border-radius:6px;font-weight:600">Open the tracker</a></p>');
  h.push('<p style="margin:18px 0 0;color:#8a929c;font-size:12px">You get this email each morning when you have pending tasks. Change this in Settings, in the tracker.</p>');
  h.push('</div>');

  return { to: person.email || '', subject, text: text.join('\n'), html: h.join(''), digest: d };
}

/** Build the emails for every person. People with no email address are skipped by the sender. */
function buildAllDigests(state, today, appUrl) {
  return state.people.map((p) => buildDigestEmail(state, p, today, appUrl)).filter(Boolean);
}

// ---- core/biz.js ----
// Business numbers: money, clients, activity, calendar feed, email and calendar links.
// Pure functions only.




// ---------- Money format ----------

/** "$1,234.50" or "$1,235" when whole is true. Negative: "-$20". */
function money(n, symbol, whole) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  const fixed = whole ? String(Math.round(abs)) : abs.toFixed(2);
  const bits = fixed.split('.');
  bits[0] = bits[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '-' : '') + (symbol || '$') + bits.join('.');
}

/** Compact money for tiles and axes: $950, $4.8K, $1.2M. */
function moneyShort(n, symbol) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  const s = symbol || '$';
  if (abs >= 1000000) return sign + s + (abs / 1000000).toFixed(abs >= 10000000 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (abs >= 10000) return sign + s + (abs / 1000).toFixed(abs >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return sign + s + String(Math.round(abs)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// ---------- Invoices ----------

function invoiceTotal(inv) {
  return round2((inv.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.rate) || 0), 0));
}

/** The state shown to the user: draft, sent, overdue, paid or void. */
function invoiceState(inv, today) {
  if (inv.status === 'sent' && inv.dueDate && inv.dueDate < today) return 'overdue';
  return inv.status;
}

const INVOICE_STATE_LABEL = { draft: 'Draft', sent: 'Sent', overdue: 'Overdue', paid: 'Paid', void: 'Cancelled' };

/** The next free invoice number, for example INV-0007. */
function nextInvoiceNumber(state) {
  const prefix = (state.settings && state.settings.invoicePrefix) || 'INV-';
  let max = 0;
  state.invoices.forEach((v) => {
    const m = /(\d+)\s*$/.exec(v.number || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  const n = String(max + 1);
  return prefix + (n.length < 4 ? '0000'.slice(n.length) + n : n);
}

/** Plain text of an invoice, for an email or a chat message. */
function invoiceText(inv, client, settings) {
  const sym = (settings && settings.currency) || '$';
  const lines = [];
  lines.push('Invoice ' + inv.number + (inv.title ? ' - ' + inv.title : ''));
  if (client) lines.push('To: ' + client.name + (client.contact ? ' (' + client.contact + ')' : ''));
  if (inv.issueDate) lines.push('Date: ' + fmtLong(inv.issueDate));
  if (inv.dueDate) lines.push('Due: ' + fmtLong(inv.dueDate));
  lines.push('');
  (inv.items || []).forEach((it) => lines.push('- ' + it.desc + ': ' + it.qty + ' x ' + money(it.rate, sym) + ' = ' + money(it.qty * it.rate, sym)));
  lines.push('');
  lines.push('Total: ' + money(invoiceTotal(inv), sym));
  if (settings && settings.payNote) {
    lines.push('');
    lines.push(settings.payNote);
  }
  if (inv.notes) {
    lines.push('');
    lines.push(inv.notes);
  }
  return lines.join('\n');
}

// ---------- Money summary ----------

function inRange(d, a, b) {
  return !!d && d >= a && d <= b;
}

function paidIn(state, a, b, clientId) {
  return state.invoices.filter((v) => v.status === 'paid' && inRange(v.paidOn, a, b) && (!clientId || v.clientId === clientId));
}

function spentIn(state, a, b, clientId) {
  return state.expenses.filter((x) => inRange(x.date, a, b) && (!clientId || x.clientId === clientId));
}

function sumInv(list) {
  return round2(list.reduce((s, v) => s + invoiceTotal(v), 0));
}
function sumExp(list) {
  return round2(list.reduce((s, x) => s + (Number(x.amount) || 0), 0));
}

function pct(now, prev) {
  if (!prev) return null;
  return Math.round(((now - prev) / Math.abs(prev)) * 100);
}

/** Money numbers for the month that holds `today`, with the month before for comparison. */
function moneySummary(state, today) {
  const a = startOfMonth(today);
  const b = endOfMonth(today);
  const pa = addMonths(a, -1);
  const pb = endOfMonth(pa);
  const ya = today.slice(0, 4) + '-01-01';
  const revenue = sumInv(paidIn(state, a, b));
  const revenuePrev = sumInv(paidIn(state, pa, pb));
  const expenses = sumExp(spentIn(state, a, b));
  const expensesPrev = sumExp(spentIn(state, pa, pb));
  const open = state.invoices.filter((v) => v.status === 'sent');
  const overdue = open.filter((v) => v.dueDate && v.dueDate < today);
  const drafts = state.invoices.filter((v) => v.status === 'draft');
  const profit = round2(revenue - expenses);
  return {
    month: a,
    monthLabel: MONTHS[parts(a).m - 1] + ' ' + parts(a).y,
    revenue,
    revenuePrev,
    revenueDelta: pct(revenue, revenuePrev),
    expenses,
    expensesPrev,
    expensesDelta: pct(expenses, expensesPrev),
    profit,
    profitPrev: round2(revenuePrev - expensesPrev),
    margin: revenue > 0 ? Math.round((profit / revenue) * 100) : null,
    outstanding: sumInv(open),
    outstandingCount: open.length,
    overdue: sumInv(overdue),
    overdueCount: overdue.length,
    draftCount: drafts.length,
    draftTotal: sumInv(drafts),
    ytdRevenue: sumInv(paidIn(state, ya, today)),
    ytdExpenses: sumExp(spentIn(state, ya, today)),
  };
}

/** Revenue, expenses and profit for each of the last `months` months (this month last). */
function monthlySeries(state, today, months) {
  const out = [];
  const first = startOfMonth(today);
  for (let i = (months || 6) - 1; i >= 0; i--) {
    const a = addMonths(first, -i);
    const b = endOfMonth(a);
    const revenue = sumInv(paidIn(state, a, b));
    const expenses = sumExp(spentIn(state, a, b));
    out.push({ month: a, label: MONTHS[parts(a).m - 1], full: MONTHS[parts(a).m - 1] + ' ' + parts(a).y, revenue, expenses, profit: round2(revenue - expenses) });
  }
  return out;
}

/** Expense total for each category between 2 dates, largest first. */
function expenseByCategory(state, a, b) {
  const rows = EXPENSE_CATS.map((c) => ({ id: c.id, label: c.label, total: 0, count: 0 }));
  spentIn(state, a, b).forEach((x) => {
    const row = rows.find((r) => r.id === x.category) || rows[rows.length - 1];
    row.total = round2(row.total + x.amount);
    row.count++;
  });
  return rows.filter((r) => r.count > 0).sort((x, y) => y.total - x.total);
}

/**
 * Numbers for each client over the last 12 months.
 * roi = (revenue - direct cost) / direct cost, or null when no cost is linked to the client.
 */
function clientStats(state, today) {
  const from = addMonths(today, -12);
  return state.clients.map((c) => {
    const tasks = state.tasks.filter((t) => t.clientId === c.id);
    const open = tasks.filter(isOpen);
    const paid = paidIn(state, from, today, c.id);
    const revenue = sumInv(paid);
    const cost = sumExp(spentIn(state, from, today, c.id));
    const unpaid = state.invoices.filter((v) => v.clientId === c.id && v.status === 'sent');
    const dates = []
      .concat(tasks.map((t) => (t.updatedAt || '').slice(0, 10)))
      .concat(state.invoices.filter((v) => v.clientId === c.id).map((v) => v.paidOn || v.issueDate))
      .filter(Boolean)
      .sort();
    return {
      client: c,
      openTasks: open.length,
      overdueTasks: open.filter((t) => isOverdue(t, today)).length,
      stuckTasks: open.filter((t) => t.status === 'stuck').length,
      revenue,
      cost,
      profit: round2(revenue - cost),
      roi: cost > 0 ? Math.round(((revenue - cost) / cost) * 100) : null,
      outstanding: sumInv(unpaid),
      overdueInvoices: unpaid.filter((v) => v.dueDate && v.dueDate < today).length,
      invoiceCount: state.invoices.filter((v) => v.clientId === c.id).length,
      lastActivity: dates.length ? dates[dates.length - 1] : '',
    };
  });
}

// ---------- Activity and productivity ----------

/** The newest events across tasks, invoices, expenses and notes. Each: { at, kind, text, sub, ref }. */
function recentActivity(state, limit) {
  const out = [];
  const person = (id) => {
    const p = state.people.find((x) => x.id === id);
    return p ? p.name : '';
  };
  state.tasks.forEach((t) => {
    (t.history || []).forEach((hh) => {
      const kind = hh.what.indexOf('to Completed') !== -1 ? 'done' : hh.what.indexOf('to Stuck') !== -1 ? 'stuck' : hh.what === 'Task created' ? 'new' : 'edit';
      out.push({ at: hh.at, kind, text: t.title, sub: hh.what + (person(hh.by) ? ' · ' + person(hh.by) : ''), ref: { type: 'task', id: t.id } });
    });
  });
  const sym = (state.settings && state.settings.currency) || '$';
  const client = (id) => {
    const c = state.clients.find((x) => x.id === id);
    return c ? c.name : '';
  };
  state.invoices.forEach((v) => {
    if (v.status === 'paid' && v.paidOn) out.push({ at: v.paidOn + 'T12:00:00.000Z', kind: 'money', text: 'Invoice ' + v.number + ' paid', sub: money(invoiceTotal(v), sym) + (client(v.clientId) ? ' · ' + client(v.clientId) : ''), ref: { type: 'invoice', id: v.id } });
    else if (v.status === 'sent' && v.issueDate) out.push({ at: v.issueDate + 'T09:00:00.000Z', kind: 'send', text: 'Invoice ' + v.number + ' sent', sub: money(invoiceTotal(v), sym) + (client(v.clientId) ? ' · ' + client(v.clientId) : ''), ref: { type: 'invoice', id: v.id } });
  });
  state.expenses.forEach((x) => {
    if (x.date) out.push({ at: x.date + 'T10:00:00.000Z', kind: 'spend', text: (x.vendor || 'Expense') + ' ' + money(x.amount, sym), sub: (EXPENSE_CATS.find((c) => c.id === x.category) || { label: 'Other' }).label + (client(x.clientId) ? ' · ' + client(x.clientId) : ''), ref: { type: 'expense', id: x.id } });
  });
  state.notes.forEach((n) => {
    if (n.updatedAt) out.push({ at: n.updatedAt, kind: 'note', text: n.title || 'Note', sub: 'Note updated', ref: { type: 'note', id: n.id } });
  });
  out.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  return out.slice(0, limit || 12);
}

/** Tasks completed on each weekday in the last `weeks` weeks. Monday first. */
function weekdayOutput(state, today, weeks) {
  const from = addDays(today, -7 * (weeks || 8) + 1);
  const counts = [0, 0, 0, 0, 0, 0, 0];
  state.tasks.forEach((t) => {
    if (t.status === 'done' && inRange(t.completedOn, from, today)) counts[dow(t.completedOn)]++;
  });
  return [1, 2, 3, 4, 5, 6, 0].map((d) => ({ day: d, label: DOWS[d], count: counts[d] }));
}

/**
 * Findings about the business in plain language. Rules, not AI: each one is computed from the data.
 * Each: { tone: 'good' | 'warn' | 'bad' | 'info', title, detail, go } where go names a screen.
 */
function bizInsights(state, today) {
  const out = [];
  const sym = (state.settings && state.settings.currency) || '$';
  const m = moneySummary(state, today);
  if (m.overdueCount) out.push({ tone: 'bad', title: m.overdueCount + (m.overdueCount === 1 ? ' invoice is' : ' invoices are') + ' overdue: ' + money(m.overdue, sym, true), detail: 'Send a payment reminder today.', go: 'invoices' });
  if (m.revenueDelta !== null && (m.revenue || m.revenuePrev)) {
    const up = m.revenueDelta >= 0;
    out.push({ tone: up ? 'good' : 'warn', title: 'Revenue is ' + (up ? 'up ' : 'down ') + Math.abs(m.revenueDelta) + '% against last month', detail: money(m.revenue, sym, true) + ' paid in ' + m.monthLabel + ', ' + money(m.revenuePrev, sym, true) + ' in the month before. The month is not complete yet.', go: 'invoices' });
  }
  if (m.margin !== null) out.push({ tone: m.margin >= 40 ? 'good' : m.margin >= 15 ? 'info' : 'warn', title: 'Profit margin this month: ' + m.margin + '%', detail: money(m.profit, sym, true) + ' left from ' + money(m.revenue, sym, true) + ' after ' + money(m.expenses, sym, true) + ' of expenses.', go: 'expenses' });
  if (m.draftCount) out.push({ tone: 'info', title: m.draftCount + (m.draftCount === 1 ? ' draft invoice is' : ' draft invoices are') + ' not sent: ' + money(m.draftTotal, sym, true), detail: 'Money that is not billed is not paid.', go: 'invoices' });

  const stats = clientStats(state, today).filter((s) => s.revenue > 0);
  const total = stats.reduce((s, x) => s + x.revenue, 0);
  if (stats.length >= 2 && total > 0) {
    const top = stats.slice().sort((a, b) => b.revenue - a.revenue)[0];
    const share = Math.round((top.revenue / total) * 100);
    if (share >= 45) out.push({ tone: 'warn', title: top.client.name + ' gives ' + share + '% of your revenue', detail: 'One client is a large part of the income of the last 12 months. A second strong client lowers the risk.', go: 'clients' });
    const best = stats.filter((s) => s.roi !== null).sort((a, b) => b.roi - a.roi)[0];
    if (best) out.push({ tone: 'info', title: 'Best return: ' + best.client.name + ' (' + best.roi + '%)', detail: money(best.revenue, sym, true) + ' revenue for ' + money(best.cost, sym, true) + ' of direct cost in 12 months.', go: 'clients' });
  }
  const cats = expenseByCategory(state, m.month, endOfMonth(today));
  if (cats.length && m.expenses > 0) out.push({ tone: 'info', title: 'Largest cost this month: ' + cats[0].label.toLowerCase(), detail: money(cats[0].total, sym, true) + ', ' + Math.round((cats[0].total / m.expenses) * 100) + '% of the expenses of ' + m.monthLabel + '.', go: 'expenses' });

  const wd = weekdayOutput(state, today, 8);
  const sumWd = wd.reduce((s, x) => s + x.count, 0);
  if (sumWd >= 8) {
    const bestDay = wd.slice().sort((a, b) => b.count - a.count)[0];
    out.push({ tone: 'info', title: 'Your most productive day is ' + bestDay.label, detail: bestDay.count + ' of ' + sumWd + ' tasks in the last 8 weeks were completed on a ' + bestDay.label + '.', go: 'review' });
  }
  return out;
}

// ---------- Calendar feed and links ----------

function icsEscape(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

function icsFold(line) {
  // A calendar line holds 75 bytes at most. Longer lines continue on the next line after 1 space.
  const out = [];
  let rest = line;
  while (rest.length > 73) {
    out.push(rest.slice(0, 73));
    rest = ' ' + rest.slice(73);
  }
  out.push(rest);
  return out.join('\r\n');
}

function icsDate(d) {
  return d.replace(/-/g, '');
}

function icsStamp(iso) {
  const d = new Date(iso || Date.now());
  const t = isNaN(d.getTime()) ? new Date() : d;
  return t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()) + 'T' + pad2(t.getUTCHours()) + pad2(t.getUTCMinutes()) + pad2(t.getUTCSeconds()) + 'Z';
}

/**
 * The tracker as a calendar file (iCalendar). Google Calendar, Outlook and Apple Calendar read it.
 * Events keep their time (local time). Open tasks show as all-day items on the due date.
 */
function icsFeed(state, opts) {
  const o = opts || {};
  const name = (state.settings && state.settings.workspaceName) || 'Task Tracker';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Task Tracker//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEscape(name)];
  const stamp = icsStamp(o.now);
  const mine = (ownerId) => !o.personId || !ownerId || ownerId === o.personId;
  state.events.forEach((e) => {
    if (!e.date || !mine(e.ownerId)) return;
    lines.push('BEGIN:VEVENT', 'UID:' + e.id + '@task-tracker', 'DTSTAMP:' + stamp);
    if (e.start) {
      const st = e.start.replace(':', '') + '00';
      const en = (e.end && e.end > e.start ? e.end : e.start).replace(':', '') + '00';
      lines.push('DTSTART:' + icsDate(e.date) + 'T' + st, 'DTEND:' + icsDate(e.date) + 'T' + en);
    } else {
      lines.push('DTSTART;VALUE=DATE:' + icsDate(e.date), 'DTEND;VALUE=DATE:' + icsDate(addDays(e.date, 1)));
    }
    lines.push('SUMMARY:' + icsEscape(e.title));
    if (e.notes) lines.push('DESCRIPTION:' + icsEscape(e.notes));
    lines.push('END:VEVENT');
  });
  state.tasks.forEach((t) => {
    if (!t.due || !isOpen(t) || !(!o.personId || !t.ownerId || isAssigned(t, o.personId))) return;
    lines.push('BEGIN:VEVENT', 'UID:' + t.id + '@task-tracker', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + icsDate(t.due), 'DTEND;VALUE=DATE:' + icsDate(addDays(t.due, 1)));
    lines.push('SUMMARY:' + icsEscape('Due: ' + t.title + (t.status === 'stuck' ? ' (stuck)' : '')));
    lines.push('DESCRIPTION:' + icsEscape(STATUS[t.status].label + (t.remarks ? '. ' + t.remarks : '')));
    lines.push('TRANSP:TRANSPARENT', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}

/** Links that open "new event" in Google Calendar and in Outlook, filled with the item. */
function calendarLinks(item) {
  const title = encodeURIComponent(item.title || '');
  const details = encodeURIComponent(item.notes || '');
  const d = item.date;
  let gDates;
  let oStart;
  let oEnd;
  let allDay = false;
  if (item.start) {
    const end = item.end && item.end > item.start ? item.end : item.start;
    gDates = icsDate(d) + 'T' + item.start.replace(':', '') + '00/' + icsDate(d) + 'T' + end.replace(':', '') + '00';
    oStart = d + 'T' + item.start + ':00';
    oEnd = d + 'T' + end + ':00';
  } else {
    allDay = true;
    gDates = icsDate(d) + '/' + icsDate(addDays(d, 1));
    oStart = d;
    oEnd = addDays(d, 1);
  }
  return {
    google: 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + title + '&dates=' + gDates + (details ? '&details=' + details : ''),
    outlook: 'https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=' + title + '&startdt=' + encodeURIComponent(oStart) + '&enddt=' + encodeURIComponent(oEnd) + (allDay ? '&allday=true' : '') + (details ? '&body=' + details : ''),
  };
}

/** Links that open "new email" in Gmail and in Outlook, and a mailto link. */
function mailLinks(msg) {
  const to = encodeURIComponent(msg.to || '');
  const su = encodeURIComponent(msg.subject || '');
  const body = encodeURIComponent(msg.body || '');
  return {
    gmail: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + to + '&su=' + su + '&body=' + body,
    outlook: 'https://outlook.live.com/mail/0/deeplink/compose?to=' + to + '&subject=' + su + '&body=' + body,
    mailto: 'mailto:' + (msg.to || '') + '?subject=' + su + '&body=' + body,
  };
}

/** Short relative time: "now", "5 min ago", "3 h ago", "2 d ago", or a date. */
function timeAgo(iso, nowMs, today) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const mins = Math.round((nowMs - t) / 60000);
  if (mins < 0) return fmtShort(iso.slice(0, 10), parts(today).y);
  if (mins < 2) return 'now';
  if (mins < 60) return mins + ' min ago';
  if (mins < 60 * 24) return Math.round(mins / 60) + ' h ago';
  const days = diffDays(iso.slice(0, 10), today);
  if (days <= 6) return Math.max(1, days) + ' d ago';
  return fmtShort(iso.slice(0, 10), parts(today).y);
}

// ---------- Ads tracker ----------

function ratio(a, b) {
  return b > 0 ? Math.round((a / b) * 100) / 100 : null;
}

function adTotals(list) {
  const t = { spend: 0, leads: 0, clicks: 0, sales: 0, count: list.length };
  list.forEach((a) => {
    t.spend = round2(t.spend + a.spend);
    t.leads += a.leads;
    t.clicks += a.clicks;
    t.sales += a.sales;
  });
  t.costPerLead = ratio(t.spend, t.leads);
  t.costPerSale = ratio(t.spend, t.sales);
  t.costPerClick = ratio(t.spend, t.clicks);
  t.leadToSale = t.leads > 0 ? Math.round((t.sales / t.leads) * 100) : null;
  return t;
}

function adFilter(state, f) {
  const o = f || {};
  return state.ads.filter((a) => (!o.ownerId || !a.ownerId || a.ownerId === o.ownerId) && (!o.platform || a.platform === o.platform) && (!o.clientId || a.clientId === o.clientId));
}

/** Ad numbers for the month of `today`, with the month before. */
function adSummary(state, today, f) {
  const a = startOfMonth(today);
  const b = endOfMonth(today);
  const pa = addMonths(a, -1);
  const pb = endOfMonth(pa);
  const list = adFilter(state, f);
  const now = adTotals(list.filter((x) => inRange(x.date, a, b)));
  const prev = adTotals(list.filter((x) => inRange(x.date, pa, pb)));
  return { monthLabel: MONTHS[parts(a).m - 1] + ' ' + parts(a).y, now, prev, spendDelta: pct(now.spend, prev.spend), leadsDelta: pct(now.leads, prev.leads), cplDelta: now.costPerLead !== null && prev.costPerLead ? pct(now.costPerLead, prev.costPerLead) : null };
}

/** Totals for each campaign between 2 dates, largest spend first. */
function adByCampaign(state, a, b, f) {
  const map = {};
  adFilter(state, f)
    .filter((x) => inRange(x.date, a, b))
    .forEach((x) => {
      const key = (x.campaign || 'No campaign name') + '|' + x.platform;
      (map[key] = map[key] || { campaign: x.campaign || 'No campaign name', platform: x.platform, list: [] }).list.push(x);
    });
  return Object.keys(map)
    .map((k) => Object.assign({ campaign: map[k].campaign, platform: map[k].platform }, adTotals(map[k].list)))
    .sort((x, y) => y.spend - x.spend);
}

/** Spend and leads for each of the last `weeks` weeks (Monday start). */
function adWeekly(state, today, weeks, f) {
  const d = dow(today);
  const thisWeek = addDays(today, d === 0 ? -6 : 1 - d);
  const list = adFilter(state, f);
  const out = [];
  for (let i = (weeks || 8) - 1; i >= 0; i--) {
    const start = addDays(thisWeek, -7 * i);
    const end = addDays(start, 6);
    const t = adTotals(list.filter((x) => inRange(x.date, start, end)));
    out.push(Object.assign({ start, label: fmtShort(start) }, t));
  }
  return out;
}

// ---------- Sales tracker (daily tally) ----------

const SALES_KEYS = ['leads', 'contacted', 'booked', 'closed'];

function salesTotals(list) {
  const t = { leads: 0, contacted: 0, booked: 0, closed: 0, value: 0, days: 0 };
  const seen = {};
  list.forEach((d) => {
    SALES_KEYS.forEach((k) => (t[k] += d[k]));
    t.value = round2(t.value + d.value);
    seen[d.date] = true;
  });
  t.days = Object.keys(seen).length;
  t.closeRate = t.leads > 0 ? Math.round((t.closed / t.leads) * 100) : null;
  t.avgSale = t.closed > 0 ? round2(t.value / t.closed) : null;
  return t;
}

function salesFilter(state, ownerId) {
  return state.sales.filter((d) => !ownerId || d.ownerId === ownerId);
}

/** The tally of 1 day: for 1 person, or the sum of all people when ownerId is empty. */
function salesOfDay(state, date, ownerId) {
  return salesTotals(salesFilter(state, ownerId).filter((d) => d.date === date));
}

/** Sales numbers for the month of `today`, with the month before. */
function salesSummary(state, today, ownerId) {
  const a = startOfMonth(today);
  const b = endOfMonth(today);
  const pa = addMonths(a, -1);
  const pb = endOfMonth(pa);
  const list = salesFilter(state, ownerId);
  const now = salesTotals(list.filter((d) => inRange(d.date, a, b)));
  const prev = salesTotals(list.filter((d) => inRange(d.date, pa, pb)));
  return { monthLabel: MONTHS[parts(a).m - 1] + ' ' + parts(a).y, now, prev, leadsDelta: pct(now.leads, prev.leads), closedDelta: pct(now.closed, prev.closed), valueDelta: pct(now.value, prev.value) };
}

/** One row for each of the last `days` days (today last), with zeros for days with no entry. */
function salesDaily(state, today, days, ownerId) {
  const list = salesFilter(state, ownerId);
  const out = [];
  for (let i = (days || 14) - 1; i >= 0; i--) {
    const date = addDays(today, -i);
    out.push(Object.assign({ date, label: fmtShort(date), dow: DOWS[dow(date)] }, salesTotals(list.filter((d) => d.date === date))));
  }
  return out;
}

// Small DOM helpers. Text always goes in through textContent, never innerHTML, so user text cannot run as code.

const SVG_NS = 'http://www.w3.org/2000/svg';

function applyProps(el, props, isSvg) {
  if (!props) return;
  for (const key in props) {
    const v = props[key];
    if (v === null || v === undefined || v === false) continue;
    if (key === 'class') el.setAttribute('class', v);
    else if (key === 'style' && typeof v === 'object') {
      for (const sk in v) {
        if (v[sk] === null || v[sk] === undefined) continue;
        if (sk.indexOf('--') === 0) el.style.setProperty(sk, v[sk]);
        else el.style[sk] = v[sk];
      }
    } else if (key.length > 2 && key[0] === 'o' && key[1] === 'n' && typeof v === 'function') el.addEventListener(key.slice(2), v);
    else if (key === 'value' && !isSvg) el.value = v;
    else if (key === 'checked' && !isSvg) el.checked = !!v;
    else if (key === 'disabled' && !isSvg) el.disabled = !!v;
    else if (key === 'selected' && !isSvg) el.selected = !!v;
    else if (v === true) el.setAttribute(key, '');
    else el.setAttribute(key, v);
  }
}

function appendKids(el, kids) {
  for (let i = 0; i < kids.length; i++) {
    const k = kids[i];
    if (k === null || k === undefined || k === false || k === true) continue;
    if (Array.isArray(k)) appendKids(el, k);
    else if (k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
}

/** Create an HTML element: h('div', { class: 'x', onclick: fn }, 'text', child) */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  applyProps(el, props, false);
  appendKids(el, kids);
  return el;
}

/** Create an SVG element. */
function s(tag, props, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  applyProps(el, props, true);
  appendKids(el, kids);
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

// ---------- Device-only settings ----------

function lsGet(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}
function lsSet(key, value) {
  try {

    return true;
  } catch (e) {
    return false;
  }
}

function loadUi() {
  const raw = lsGet(LS_UI);
  if (!raw) return;

    const saved = JSON.parse(raw);
    const keep = ['route', 'meId', 'collapsedGroups', 'taskFilter', 'dashFilter', 'calShow', 'briefDismissed', 'dashChart', 'noteId', 'scope'];
    keep.forEach((k) => {
      if (saved[k] === undefined || saved[k] === null) return;
      if (typeof app.ui[k] === 'object') app.ui[k] = Object.assign({}, app.ui[k], saved[k]);
      else app.ui[k] = saved[k];
    });

    app.ui.taskFilter.special = '';
  } catch (e) {
    /* ignore a damaged entry */
  }
}

function saveUi() {

// ---------- Difference between two states ----------

const COLLECTIONS = ['tasks', 'events', 'lapses', 'people', 'groups', 'clients', 'invoices', 'expenses', 'notes', 'ads', 'sales'];

/** List the records that differ between prev and next. Used to send only the changes to the backend. */
function diffState(prev, next) {
  const ops = [];
  COLLECTIONS.forEach((c) => {
    if (prev[c] === next[c]) return;
    const before = {};
    prev[c].forEach((r) => (before[r.id] = r));
    const seen = {};
    next[c].forEach((r) => {
      seen[r.id] = true;
      const old = before[r.id];
      if (!old || (old !== r && JSON.stringify(old) !== JSON.stringify(r))) ops.push({ c, op: 'put', id: r.id, data: r });
    });
    prev[c].forEach((r) => {
      if (!seen[r.id]) ops.push({ c, op: 'del', id: r.id });
    });
  });
  if (prev.settings !== next.settings && JSON.stringify(prev.settings) !== JSON.stringify(next.settings)) ops.push({ c: 'settings', op: 'put', id: 'settings', data: next.settings });
  return ops;
}

// ---------- Undo (1 level) ----------
let undoState = null;
function canUndo() {
  return !!undoState;
}
function undo() {
  if (!undoState) return;
  const target = undoState;
  undoState = null;
  commit(target, { noUndo: true });
}

// ---------- Commit a new state ----------

/** Replace the shared state. Saves the change and draws again. */
function commit(next, opts) {
  const prev = app.state;
  if (next === prev) return;
  const ops = diffState(prev, next);
  if (!(opts && opts.noUndo)) undoState = opts && opts.undoable ? prev : null;
  app.state = next;
  if (ops.length) persist(ops);
  emit();
}

function persist(ops) {
  if (app.mode === 'google') {
    queue = queue.concat(ops);
    app.sync.pending = queue.length;
    flushSoon();
  } else {
    saveLocal();
  }
}

function saveLocal() {
  if (app.memoryOnly) return;
  const ok = lsSet(LS_STATE, JSON.stringify(app.state));
  if (!ok) {
    app.memoryOnly = true;
    app.sync.status = 'memory';
  } else {
    app.sync.status = 'saved';
    app.sync.lastSaved = new Date().toISOString();
  }
}

// ---------- Google backend ----------

let queue = [];
let flushTimer = 0;
let flushing = false;
let retryDelay = 2000;

function gasCall(name, args) {
  return new Promise((resolve, reject) => {
    try {
      const runner = window.google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => reject(err instanceof Error ? err : new Error(String((err && err.message) || err))));
      runner[name].apply(runner, args || []);
    } catch (e) {
      reject(e);
    }
  });
}

/** Call a backend function. The access key of this user goes with every call. */
function backend(name, ...args) {
  if (app.mode !== 'google') return Promise.reject(new Error('This action needs the Google connection.'));
  return gasCall(name, [app.boot.token].concat(args));
}

function flushSoon() {
  if (flushTimer) return;
  flushTimer = setTimeout(() => {
    flushTimer = 0;
    flush();
  }, 400);
}

function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  const batch = queue.slice();
  app.sync.status = 'saving';
  emit();
  backend('apiPush', JSON.stringify(batch))
    .then((res) => {
      queue = queue.slice(batch.length);
      flushing = false;
      retryDelay = 2000;
      app.sync.rev = (res && res.rev) || app.sync.rev;
      app.sync.status = 'saved';
      app.sync.error = '';
      app.sync.lastSaved = new Date().toISOString();
      app.sync.pending = queue.length;
      emit();
      if (queue.length) flushSoon();
    })
    .catch((err) => {
      flushing = false;
      app.sync.status = 'error';
      app.sync.error = String((err && err.message) || err);
      app.sync.pending = queue.length;
      emit();
      setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 60000);
    });
}

/** Ask the backend for changes made by the other person. */
function pollBackend() {
  if (app.mode !== 'google' || flushing || queue.length) return Promise.resolve(false);
  return backend('apiPoll', app.sync.rev)
    .then((res) => {
      if (!res || !res.changed || flushing || queue.length) return false;
      const parsed = typeof res.state === 'string' ? JSON.parse(res.state) : res.state;
      app.state = sanitizeState(parsed);
      app.sync.rev = res.rev;
      undoState = null;
      emit();
      return true;
    })
    .catch(() => false);
}

function applyScopeFilters() {
  const owner = app.ui.scope === 'all' ? '' : meId();
  app.ui.taskFilter = Object.assign({}, app.ui.taskFilter, { ownerId: owner });
  app.ui.dashFilter = Object.assign({}, app.ui.dashFilter, { ownerId: owner });
}

// ---------- Start ----------

function readHashOptions() {
  const m = /today=(\d{4}-\d{2}-\d{2})/.exec(String(window.location.hash || ''));
  if (m && isDateStr(m[1])) app.ui.todayOverride = m[1];
}

/** Load the data. Returns a promise that resolves when the app can draw. */
function startStore() {
  loadUi();
  try {
    readHashOptions();
  } catch (e) {
    /* no hash in this host */
  }
  const hasGoogle = !!(app.boot && app.boot.token && window.google && window.google.script && window.google.script.run);
  if (hasGoogle) {
    app.mode = 'google';
    app.sync.status = 'loading';
    return backend('apiLoad').then((res) => {
      const parsed = typeof res.state === 'string' ? JSON.parse(res.state) : res.state;
      app.state = sanitizeState(parsed);
      app.sync.rev = res.rev || 0;
      app.sync.status = 'saved';
      applyScopeFilters();
      app.loaded = true;
      setInterval(() => {
        if (!document.hidden) pollBackend();
      }, 45000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) pollBackend();
      });
    });
  }
  app.mode = 'local';
  const raw = lsGet(LS_STATE);
  let loaded = null;
  if (raw) {
    try {
      loaded = sanitizeState(JSON.parse(raw));
    } catch (e) {
      loaded = null;
    }
  }
  if (loaded && (loaded.tasks.length || loaded.people.length || loaded.groups.length)) {
    app.state = loaded;
    app.sync.status = 'saved';
  } else {
    app.state = seedState(today());
    saveLocal();
  }
  // Keep 2 tabs on the same device in step.
  window.addEventListener('storage', (ev) => {
    if (ev.key !== LS_STATE || !ev.newValue) return;
    try {
      app.state = sanitizeState(JSON.parse(ev.newValue));
      emit();
    } catch (e) {
      /* ignore */
    }
  });
  applyScopeFilters();
  app.loaded = true;
  return Promise.resolve();
}

/** Demo only: put the sample data back. */
function resetToSample() {
  commit(seedState(today()), { noUndo: true });
}

/** Replace all data with an imported backup. */
function replaceAll(raw) {
  commit(sanitizeState(raw), { noUndo: true });
}

/** The person whose records show: the current person in "My view", nobody in particular in "See all". */
function scopeOwner() {
  return app.ui.scope === 'all' ? '' : meId();
}

/** Switch between "My view" and "See all". The task, dashboard and calendar filters follow. */
function setScope(scope, personId) {
  if (personId !== undefined) app.ui.meId = personId;
  app.ui.scope = scope === 'all' ? 'all' : 'mine';
  const owner = scopeOwner();
  app.ui.taskFilter = Object.assign({}, app.ui.taskFilter, { ownerId: owner });
  app.ui.dashFilter = Object.assign({}, app.ui.dashFilter, { ownerId: owner });
  setUi({});
}
