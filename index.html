function paletteItems(query) {
  const st = app.state;
  const q = query.trim().toLowerCase();
  const hit = (text) => !q || String(text).toLowerCase().indexOf(q) !== -1;
  const out = [];
  const actions = [
    ['New task', () => openNewTask({})],
    ['New invoice', () => openInvoiceModal('')],
    ['Log an expense', () => openExpenseModal('')],
    ['New note', () => addNote({})],
    ['New event', () => openEventModal('', today())],
    ['New client', () => openClientModal('')],
    ['Log ad results', () => openAdModal('')],
  ];
  actions.forEach((a) => {
    if (hit(a[0])) out.push({ kind: 'Action', iconName: 'plus', label: a[0], run: a[1] });
  });
  ROUTES.forEach((r) => {
    if (hit(r.label)) out.push({ kind: 'Screen', iconName: r.iconName, label: r.label, meta: r.sub, run: () => setUi({ route: r.id, drawerTaskId: '' }) });
  });
  if (q) {
    st.clients.forEach((c) => {
      if (hit(c.name + ' ' + c.contact)) out.push({ kind: 'Client', iconName: 'users', label: c.name, meta: c.contact, run: () => openClientModal(c.id) });
    });
    st.tasks
      .filter((t) => hit(t.title + ' ' + t.remarks + ' ' + (t.itemId || '')))
      .sort((a, b) => (a.status === 'done') - (b.status === 'done'))
      .slice(0, 8)
      .forEach((t) => out.push({ kind: 'Task', iconName: 'table', label: t.title, meta: t.status === 'done' ? 'Completed' : t.due || '', run: () => openTask(t.id) }));
    st.invoices.forEach((v) => {
      const c = findClient(v.clientId);
      if (hit(v.number + ' ' + v.title + ' ' + (c ? c.name : ''))) out.push({ kind: 'Invoice', iconName: 'file', label: v.number + (v.title ? ' · ' + v.title : ''), meta: c ? c.name : '', run: () => openInvoiceModal(v.id) });
    });
    st.notes.forEach((n) => {
      if (hit(n.title + ' ' + n.body)) out.push({ kind: 'Note', iconName: 'pen', label: n.title || 'Untitled note', meta: '', run: () => setUi({ route: 'notes', noteId: n.id, noteOpen: true }) });
    });
  }
  return out.slice(0, 14);
}

function openPalette() {
  if (document.querySelector('.palette')) return;
  let items = [];
  let index = 0;
  const input = h('input', { class: 'palette-input', type: 'text', placeholder: 'Search tasks, clients, invoices, notes, or type a command', 'data-autofocus': '', 'aria-label': 'Search', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'palette-list' });
  const list = h('div', { class: 'palette-list', id: 'palette-list', role: 'listbox' });
  const run = (it) => {
    closeModal();
    setTimeout(it.run, 0);
  };
  const draw = () => {
    while (list.firstChild) list.removeChild(list.firstChild);
    items = paletteItems(input.value);
    if (index >= items.length) index = Math.max(0, items.length - 1);
    if (!items.length) {
      list.appendChild(h('p', { class: 'palette-empty' }, 'No result for this text'));
      return;
    }
    items.forEach((it, i) => {
      list.appendChild(h('button', { class: 'palette-item' + (i === index ? ' is-on' : ''), type: 'button', role: 'option', 'aria-selected': i === index ? 'true' : 'false', tabindex: -1, onclick: () => run(it), onmousemove: () => { if (index !== i) { index = i; draw(); } } }, icon(it.iconName, 15), h('span', { class: 'palette-label' }, it.label), it.meta ? h('span', { class: 'palette-meta' }, it.meta) : null, h('span', { class: 'palette-kind' }, it.kind)));
    });
    const on = list.querySelector('.is-on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };
  input.addEventListener('input', () => {
    index = 0;
    draw();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      index = Math.min(items.length - 1, index + 1);
      draw();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      index = Math.max(0, index - 1);
      draw();
      e.preventDefault();
    } else if (e.key === 'Enter' && items[index]) {
      e.preventDefault();
      run(items[index]);
    }
  });
  const box = openModal({ title: 'Search', body: [h('div', { class: 'palette' }, input, list)], wide: true });
  box.classList.add('modal-palette');
  draw();
  input.focus();
}

              class: 'bell-item',
              type: 'button',
              onclick: () => {
                closePopover();
                openTask(r.task.id);
              },
            },
            h('span', { class: 'sdot st-' + r.task.status }),
            h('span', { class: 'bell-main' }, h('span', { class: 'bell-title' }, r.task.title), h('span', { class: 'bell-sub' }, r.why))
          )
        )
      ),
      att.length > 10 ? h('div', { class: 'pop-empty' }, 'And ' + (att.length - 10) + ' more. Open the dashboard for the full list.') : null
    ),
    { align: 'right', cls: 'pop-wide' }
  );
}

function meMenu(anchor) {
  const cur = meId();
  if (app.mode === 'google') {
    const p = findPerson(cur);
    openPopover(anchor, h('div', { class: 'pop-empty' }, 'Signed in as ' + (p ? p.name : 'a guest') + '.'), { align: 'right' });
    return;
  }
  openPopover(anchor, h('div', null, h('div', { class: 'date-pop-title' }, 'Use this device as'), menuList(app.state.people.map((p) => ({ label: p.name, node: avatar(p, 20), selected: p.id === cur, onpick: () => setScope(app.ui.scope, p.id) })))), { align: 'right' });
}

function topBar(att) {
  const route = currentRoute();
  const sync = syncLabel();
  const me = findPerson(meId());
  return h(
    'header',
    { class: 'top' },
    h('button', { class: 'icon-btn nav-toggle', type: 'button', 'aria-label': 'Menu', 'aria-expanded': app.ui.navOpen ? 'true' : 'false', onclick: () => setUi({ navOpen: !app.ui.navOpen }) }, icon('menu', 18)),
    h('div', { class: 'top-title' }, h('h1', null, route.label), h('p', { class: 'top-sub' }, route.id === 'dashboard' ? fmtLong(today()) : route.sub)),
    h(
      'div',
      { class: 'top-end' },
      h('span', { class: 'sync sync-' + (sync.tone || 'none'), role: 'status' }, h('span', { class: 'sync-dot' }), h('span', { class: 'sync-text' }, sync.text)),
      h('div', { class: 'seg scope-seg', role: 'group', 'aria-label': 'Whose records show' }, h('button', { class: 'seg-btn' + (app.ui.scope !== 'all' ? ' is-on' : ''), type: 'button', 'aria-pressed': app.ui.scope !== 'all' ? 'true' : 'false', title: me ? 'Only the records of ' + me.name : 'Only my records', onclick: () => setScope('mine') }, 'My view'), h('button', { class: 'seg-btn' + (app.ui.scope === 'all' ? ' is-on' : ''), type: 'button', 'aria-pressed': app.ui.scope === 'all' ? 'true' : 'false', title: 'The records of everyone, combined', onclick: () => setScope('all') }, 'See all')),
      canUndo() ? h('button', { class: 'icon-btn', type: 'button', title: 'Undo the last change', 'aria-label': 'Undo the last change', onclick: undo }, icon('undo', 16)) : null,
      h('button', { class: 'icon-btn bell-btn', type: 'button', 'aria-label': att.length + ' tasks need attention', 'aria-haspopup': 'dialog', onclick: (e) => bellMenu(e.currentTarget, att) }, icon('bell', 17), att.length ? h('span', { class: 'bell-count' }, att.length > 9 ? '9+' : att.length) : null),
      h('button', { class: 'me-btn', type: 'button', 'aria-label': 'Current person: ' + (me ? me.name : 'none'), 'aria-haspopup': 'menu', onclick: (e) => meMenu(e.currentTarget) }, avatar(me, 26)),
      h('button', { class: 'btn btn-primary', type: 'button', onclick: () => openNewTask({}) }, icon('plus', 15), h('span', { class: 'btn-text' }, 'New task'))
    )
  );
}

// ---------- Redraw ----------

let root = null;
let frame = 0;

function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.getAttribute || !root || !root.contains(el)) return null;
  const key = el.getAttribute('data-fk');
  if (!key) return null;
  let start = null;
  let end = null;
  try {
    start = el.selectionStart;
    end = el.selectionEnd;
  } catch (e) {
    /* this input type has no selection */
  }
  return { key, start, end, value: el.value };
}

function restoreFocus(saved) {
  if (!saved) return;
  const el = root.querySelector('[data-fk="' + saved.key.replace(/"/g, '') + '"]');
  if (!el) return;
  if (typeof saved.value === 'string' && el.value !== saved.value) el.value = saved.value;
  el.focus({ preventScroll: true });
  try {
    if (saved.start !== null && saved.start !== undefined) el.setSelectionRange(saved.start, saved.end);
  } catch (e) {
    /* this input type has no selection */
  }
}

function captureScroll() {
  const out = {};
  root.querySelectorAll('[data-scroll]').forEach((el) => (out[el.getAttribute('data-scroll')] = { top: el.scrollTop, left: el.scrollLeft }));
  return out;
}

function restoreScroll(saved) {
  root.querySelectorAll('[data-scroll]').forEach((el) => {
    const s = saved[el.getAttribute('data-scroll')];
    if (s) {
      el.scrollTop = s.top;
      el.scrollLeft = s.left;
    }
  });
}

let lastRoute = '';
let lastDrawer = '';

function draw() {
  frame = 0;
  if (!root) return;
  const focus = captureFocus();
  const scroll = captureScroll();
  const route = currentRoute();
  const att = app.loaded ? attentionList(app.state, today(), null) : [];
  if (app.loaded) setActor(meId());
  resetCharts();
  if (route.id !== 'sheets') closeSheets();
  clear(root);
  if (!app.loaded) {
    root.appendChild(h('div', { class: 'boot' }, h('p', null, app.sync.error ? 'The tracker did not load: ' + app.sync.error : 'Loading the tracker...')));
    return;
  }
  const drawer = taskDrawer();
  root.appendChild(
    h(
      'div',
      { class: 'shell' + (drawer ? ' has-drawer' : '') + (lastRoute !== route.id ? ' route-enter' : '') },
      sideNav(att.length),
      app.ui.navOpen ? h('div', { class: 'scrim', onclick: () => setUi({ navOpen: false }) }) : null,
      h('div', { class: 'main' }, topBar(att), h('main', { class: 'content', 'data-scroll': 'content-' + route.id, id: 'content', tabindex: -1 }, route.view())),
      drawer ? h('div', { class: 'drawer-scrim', onclick: closeDrawer }) : null,
      drawer
    )
  );
  if (drawer && !lastDrawer) drawer.classList.add('is-enter');
  lastDrawer = app.ui.drawerTaskId;
  if (lastRoute === route.id) restoreScroll(scroll);
  lastRoute = route.id;
  restoreFocus(focus);
  try {
    document.title = route.label + ' - ' + (app.state.settings.workspaceName || 'Task Tracker');
  } catch (e) {
    /* the host does not allow a title change */
  }
}

let drawTimer = 0;

function runDraw() {
  cancelAnimationFrame(frame);
  clearTimeout(drawTimer);
  frame = 0;
  drawTimer = 0;
  draw();
}

function scheduleDraw() {
  if (frame || drawTimer) return;
  // Animation frames stop while the page is in the background. The timer makes sure the screen still updates.
  frame = requestAnimationFrame(runDraw);
  drawTimer = setTimeout(runDraw, 50);
}

function boot() {
  root = document.getElementById('app');
  installOverlayHandlers();
  onChange(scheduleDraw);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (app.loaded) openPalette();
      return;
    }
    if (e.key === 'Escape' && !modalOpen() && !popoverOpen() && app.ui.drawerTaskId) {
      const el = document.activeElement;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) {
        el.blur();
        return;
      }
      closeDrawer();
    }
  });
  draw();
  startStore()
    .then(() => {
      draw();
    })
    .catch((err) => {
      app.sync.error = String((err && err.message) || err);
      draw();
    });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
